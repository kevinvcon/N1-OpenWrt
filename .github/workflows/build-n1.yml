
name: Build N1 OpenWrt 25.12.5

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: /tmp/openwrt-logs

jobs:
  build:
    name: Build OpenWrt for N1
    runs-on: ubuntu-24.04

    steps:

      # ------------------------------------------------------------
      # 1. Checkout configuration repository
      # ------------------------------------------------------------
      - name: Checkout configuration
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Prepare build environment
      # ------------------------------------------------------------
      - name: Prepare Ubuntu
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            ccache \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            bc \
            quilt \
            ecj \
            fastjar \
            java-propose-classpath \
            default-jdk \
            time

          echo
          echo "Ubuntu version:"
          lsb_release -a || true

          echo
          echo "Disk:"
          df -h

      # ------------------------------------------------------------
      # 3. Create log directory
      # ------------------------------------------------------------
      - name: Initialize logs
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf "${LOG_DIR}"
          sudo mkdir -p "${LOG_DIR}"
          sudo chmod 777 "${LOG_DIR}"

          echo "Log directory: ${LOG_DIR}"

      # ------------------------------------------------------------
      # 4. Clone official OpenWrt 25.12.5
      # ------------------------------------------------------------
      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git rev-parse HEAD

          echo
          echo "OpenWrt tag:"
          git describe --tags --always || true

      # ------------------------------------------------------------
      # 5. Install configuration files
      # ------------------------------------------------------------
      - name: Install OpenWrt configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f .config
          test -f feeds.conf.default

          cp .config "${OPENWRT_DIR}/.config"
          cp feeds.conf.default "${OPENWRT_DIR}/feeds.conf.default"

          echo "============================================================"
          echo "Target configuration"
          echo "============================================================"

          grep -E \
            'CONFIG_TARGET_|CONFIG_TARGET_ROOTFS|CONFIG_PACKAGE_luci|CONFIG_LUCI_LANG' \
            "${OPENWRT_DIR}/.config" || true

      # ------------------------------------------------------------
      # 6. Update feeds
      # ------------------------------------------------------------
      - name: Update feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Updating OpenWrt feeds"
          echo "============================================================"

          ./scripts/feeds update -a 2>&1 | tee "${LOG_DIR}/feeds-update.log"

      # ------------------------------------------------------------
      # 7. Install feeds
      # ------------------------------------------------------------
      - name: Install feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Installing OpenWrt feeds"
          echo "============================================================"

          ./scripts/feeds install -a 2>&1 | tee "${LOG_DIR}/feeds-install.log"

      # ------------------------------------------------------------
      # 8. Validate target
      # ------------------------------------------------------------
      - name: Validate target
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Validating target"
          echo "============================================================"

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_armsr_armv8_DEVICE_generic=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y$' .config

          echo "Target validation: OK"

      # ------------------------------------------------------------
      # 9. Generate final configuration
      # ------------------------------------------------------------
      - name: Generate defconfig
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Running make defconfig"
          echo "============================================================"

          make defconfig 2>&1 | tee "${LOG_DIR}/defconfig.log"

          echo
          echo "============================================================"
          echo "Final target configuration"
          echo "============================================================"

          grep -E \
            'CONFIG_TARGET_|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_wireguard|CONFIG_PACKAGE_zerotier|CONFIG_LUCI_LANG' \
            .config || true

      # ------------------------------------------------------------
      # 10. Download sources
      # ------------------------------------------------------------
      - name: Download sources
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Downloading source packages"
          echo "============================================================"

          make download -j2 V=s 2>&1 | tee "${LOG_DIR}/download.log"

      # ------------------------------------------------------------
      # 11. Compile
      # ------------------------------------------------------------
      - name: Build OpenWrt
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Starting OpenWrt build"
          echo "============================================================"

          echo "CPU:"
          nproc

          echo
          echo "Disk:"
          df -h

          echo
          echo "Build started:"
          date

          make -j"$(nproc)" V=s 2>&1 | tee "${LOG_DIR}/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "Build finished:"
          date

          exit "${BUILD_STATUS}"

      # ------------------------------------------------------------
      # 12. Diagnose failed build
      # ------------------------------------------------------------
      - name: Show build failure
        if: failure()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "OPENWRT BUILD FAILED"
          echo "============================================================"

          if [ -f "${LOG_DIR}/build.log" ]; then
            echo
            echo "============================================================"
            echo "LAST 300 LINES OF BUILD LOG"
            echo "============================================================"

            tail -n 300 "${LOG_DIR}/build.log"
          fi

          echo
          echo "============================================================"
          echo "AVAILABLE LOG FILES"
          echo "============================================================"

          find "${LOG_DIR}" -maxdepth 2 -type f -print 2>/dev/null || true

      # ------------------------------------------------------------
      # 13. Locate rootfs
      # ------------------------------------------------------------
      - name: Locate OpenWrt rootfs
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Searching for OpenWrt rootfs"
          echo "============================================================"

          find "${OPENWRT_DIR}/bin/targets" \
            -type f \
            \( -name '*rootfs.tar.gz' -o -name '*targz-rootfs.tar.gz' \) \
            -print

          ROOTFS="$(find "${OPENWRT_DIR}/bin/targets" \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)"

          if [ -z "${ROOTFS}" ]; then
            echo "ERROR: OpenWrt rootfs.tar.gz not found."
            exit 1
          fi

          echo "ROOTFS=${ROOTFS}" >> "${GITHUB_ENV}"

          echo
          echo "Selected rootfs:"
          echo "${ROOTFS}"

      # ------------------------------------------------------------
      # 14. Show generated files
      # ------------------------------------------------------------
      - name: Show OpenWrt output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "OpenWrt build output"
          echo "============================================================"

          find "${OPENWRT_DIR}/bin/targets" \
            -maxdepth 4 \
            -type f \
            -printf '%p %k KB\n' \
            | sort

      # ------------------------------------------------------------
      # 15. Package N1 with current Flippy interface
      # ------------------------------------------------------------
      - name: Package N1 with Flippy
        if: success()
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: ${{ env.ROOTFS }}
          PACKAGE_SOC: s905d

          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y_6.18.y
          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

          WHOAMI: kevinvcon

          GZIP_IMGS: gz
          SAVE_OPENWRT_ROOTFS: true

      # ------------------------------------------------------------
      # 16. Show Flippy output
      # ------------------------------------------------------------
      - name: Show packaged firmware
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flippy package output"
          echo "============================================================"

          echo "PACKAGED_STATUS=${PACKAGED_STATUS:-unknown}"
          echo "PACKAGED_OUTPUTPATH=${PACKAGED_OUTPUTPATH:-unknown}"
          echo "PACKAGED_OUTPUTDATE=${PACKAGED_OUTPUTDATE:-unknown}"

          if [ -n "${PACKAGED_OUTPUTPATH:-}" ] && \
             [ -d "${PACKAGED_OUTPUTPATH}" ]; then

            find "${PACKAGED_OUTPUTPATH}" \
              -maxdepth 2 \
              -type f \
              -printf '%p %k KB\n' \
              | sort
          fi

      # ------------------------------------------------------------
      # 17. Upload raw OpenWrt rootfs
      # ------------------------------------------------------------
      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-rootfs
          path: |
            ${{ env.ROOTFS }}
          if-no-files-found: error
          retention-days: 14

      # ------------------------------------------------------------
      # 18. Upload N1 firmware
      # ------------------------------------------------------------
      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-s905d
          path: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 19. Upload build logs
      # ------------------------------------------------------------
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-build-logs
          path: |
            /tmp/openwrt-logs/**
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------
      # 20. Upload final config
      # ------------------------------------------------------------
      - name: Upload final config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-final-config
          path: |
            openwrt/.config
            openwrt/feeds.conf.default
          if-no-files-found: warn
          retention-days: 30

