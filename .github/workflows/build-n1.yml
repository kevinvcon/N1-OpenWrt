
name: Build N1 OpenWrt 24.10.0 + LuCI + Flippy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.0
  OPENWRT_DIR: openwrt
  LOG_DIR: /tmp/openwrt-logs

jobs:
  build:
    name: Build OpenWrt 24.10.0 for Phicomm N1
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout user's repository
      # ============================================================
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Prepare Ubuntu 24.04 build environment
      # ============================================================
      - name: Prepare Ubuntu 24.04
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu 24.04 build environment"
          echo "============================================================"

          mkdir -p "${LOG_DIR}"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            libelf-dev \
            device-tree-compiler \
            bc \
            ccache \
            dos2unix \
            tar \
            gzip \
            xz-utils \
            zstd \
            time

          echo
          echo "============================================================"
          echo "Tool versions"
          echo "============================================================"

          gcc --version | head -n 1
          g++ --version | head -n 1
          python3 --version
          git --version
          make --version | head -n 1

          echo
          echo "Ubuntu build environment ready."

      # ============================================================
      # 3. Clone OpenWrt 24.10.0
      # ============================================================
      - name: Clone OpenWrt 24.10.0
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Cloning OpenWrt ${OPENWRT_TAG}"
          echo "============================================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt revision:"
          git log -1 --format='%H%n%ad%n%s' --date=iso

      # ============================================================
      # 4. Install .config
      # ============================================================
      - name: Install OpenWrt configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Installing .config"
          echo "============================================================"

          test -f .config

          cp .config "${OPENWRT_DIR}/.config"

          echo
          echo "Target configuration:"
          grep -E \
            '^CONFIG_TARGET_|^CONFIG_TARGET_ROOTFS_' \
            "${OPENWRT_DIR}/.config" \
            | sort

      # ============================================================
      # 5. Install feeds.conf.default
      # ============================================================
      - name: Install feeds.conf.default
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Installing feeds.conf.default"
          echo "============================================================"

          test -f feeds.conf.default

          cp feeds.conf.default \
            "${OPENWRT_DIR}/feeds.conf.default"

          echo
          echo "feeds.conf.default:"
          cat "${OPENWRT_DIR}/feeds.conf.default"

      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update OpenWrt feeds
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Updating OpenWrt feeds"
          echo "============================================================"

          ./scripts/feeds update -a \
            2>&1 | tee "${LOG_DIR}/feeds-update.log"

      # ============================================================
      # 7. Pin LuCI to exact commit
      # ============================================================
      - name: Pin LuCI to 1ce5e1b
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Pinning LuCI"
          echo "Target commit: 1ce5e1b"
          echo "============================================================"

          test -d feeds/luci/.git

          cd feeds/luci

          git fetch --depth=1 origin 1ce5e1b

          git checkout --detach 1ce5e1b

          echo
          echo "LuCI revision:"
          git log -1 \
            --format='%H%n%ad%n%s' \
            --date=iso

          test "$(git rev-parse --short HEAD)" = "1ce5e1b"

          cd ../..

          echo
          echo "LuCI successfully pinned."

      # ============================================================
      # 8. Install feeds
      # ============================================================
      - name: Install OpenWrt feeds
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Installing OpenWrt feeds"
          echo "============================================================"

          ./scripts/feeds install -a \
            2>&1 | tee "${LOG_DIR}/feeds-install.log"

      # ============================================================
      # 9. Validate target configuration
      # ============================================================
      - name: Validate target configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Validating OpenWrt target"
          echo "============================================================"

          test "$(grep -c '^CONFIG_TARGET_armsr=y$' .config)" -eq 1

          test "$(grep -c '^CONFIG_TARGET_armsr_armv8=y$' .config)" -eq 1

          test "$(grep -c '^CONFIG_TARGET_DEVICE_armsr_armv8_DEVICE_generic=y$' .config)" -eq 1

          test "$(grep -c '^CONFIG_TARGET_ROOTFS_TARGZ=y$' .config)" -eq 1

          echo
          echo "Target:"
          grep -E \
            '^CONFIG_TARGET_(armsr|DEVICE)|^CONFIG_TARGET_ROOTFS_' \
            .config

          echo
          echo "Target validation passed."

      # ============================================================
      # 10. Generate defconfig
      # ============================================================
      - name: Generate OpenWrt defconfig
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Running make defconfig"
          echo "============================================================"

          make defconfig \
            2>&1 | tee "${LOG_DIR}/defconfig.log"

      # ============================================================
      # 11. Verify important packages
      # ============================================================
      - name: Verify selected packages
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Checking selected packages"
          echo "============================================================"

          echo
          echo "LuCI:"
          grep -E '^CONFIG_PACKAGE_luci' .config || true

          echo
          echo "Argon:"
          grep -E '^CONFIG_PACKAGE_luci-theme-argon' .config || true

          echo
          echo "WireGuard:"
          grep -E '^CONFIG_PACKAGE_(wireguard-tools|kmod-wireguard)' .config || true

          echo
          echo "ZeroTier:"
          grep -E '^CONFIG_PACKAGE_(zerotier|luci-app-zerotier)' .config || true

          echo
          echo "Docker:"
          grep -E '^CONFIG_PACKAGE_(docker|dockerd|docker-compose|dockerman|containerd)' .config \
            && {
              echo "ERROR: Docker package unexpectedly selected."
              exit 1
            } || true

      # ============================================================
      # 12. Show LuCI revision
      # ============================================================
      - name: Verify LuCI revision
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "LuCI revision"
          echo "============================================================"

          git -C feeds/luci log -1 \
            --format='%H%n%ad%n%s' \
            --date=iso

          test "$(git -C feeds/luci rev-parse --short HEAD)" = "1ce5e1b"

      # ============================================================
      # 13. Download package sources
      # ============================================================
      - name: Download package sources
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Downloading OpenWrt sources"
          echo "============================================================"

          make download -j2 \
            2>&1 | tee "${LOG_DIR}/download.log"

      # ============================================================
      # 14. Build OpenWrt
      # ============================================================
      - name: Build OpenWrt
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "START OPENWRT BUILD"
          echo "============================================================"

          START_TIME="$(date +%s)"

          make -j"$(nproc)" V=s \
            2>&1 | tee "${LOG_DIR}/openwrt-build.log"

          BUILD_STATUS="${PIPESTATUS[0]}"

          END_TIME="$(date +%s)"
          BUILD_TIME="$((END_TIME - START_TIME))"

          echo
          echo "============================================================"
          echo "OPENWRT BUILD FINISHED"
          echo "Exit code : ${BUILD_STATUS}"
          echo "Build time: ${BUILD_TIME} seconds"
          echo "============================================================"

          if [ "${BUILD_STATUS}" -ne 0 ]; then

            echo
            echo "============================================================"
            echo "OPENWRT BUILD FAILED"
            echo "============================================================"

            echo
            echo "---------------- LAST 300 LINES ----------------"
            tail -n 300 "${LOG_DIR}/openwrt-build.log" || true

            echo
            echo "---------------- ERROR SUMMARY ----------------"
            grep -nEi \
              '(^|[^a-z])(error|failed|fatal|undefined reference|cannot find|no such file|recipe for target|configuration failed|build failed)([^a-z]|:)' \
              "${LOG_DIR}/openwrt-build.log" \
              | tail -n 200 || true

            echo
            echo "---------------- FAILED PACKAGES ----------------"
            grep -nEi \
              'package/.*/(compile|install)|make\[[0-9]+\].*(Error|error)|ERROR:' \
              "${LOG_DIR}/openwrt-build.log" \
              | tail -n 200 || true

            exit "${BUILD_STATUS}"
          fi

      # ============================================================
      # 15. Locate OpenWrt rootfs
      # ============================================================
      - name: Locate OpenWrt rootfs for Flippy
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Searching for rootfs.tar.gz"
          echo "============================================================"

          find bin/targets \
            -type f \
            \( \
              -name '*rootfs.tar.gz' \
              -o -name '*rootfs*.tar.gz' \
            \) \
            -print

          ROOTFS="$(find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)"

          if [ -z "${ROOTFS}" ]; then
            echo "ERROR: OpenWrt rootfs.tar.gz was not generated."
            exit 1
          fi

          echo
          echo "Selected rootfs:"
          echo "${ROOTFS}"

          mkdir -p "${GITHUB_WORKSPACE}/flippy-input"

          cp "${ROOTFS}" \
            "${GITHUB_WORKSPACE}/flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz"

          echo
          echo "Flippy input:"
          ls -lh \
            "${GITHUB_WORKSPACE}/flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz"

      # ============================================================
      # 16. Package Phicomm N1 with Flippy
      # ============================================================
      - name: Package Phicomm N1 with Flippy
        if: success()
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: stable
          KERNEL_AUTO_LATEST: true
          OPENWRT_IP: 192.168.1.1
          WHOAMI: N1-OpenWrt

      # ============================================================
      # 17. Inspect Flippy output
      # ============================================================
      - name: Inspect Flippy output
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "FLIPPY OUTPUT"
          echo "============================================================"

          echo
          echo "Environment:"
          env | grep -E \
            '^(PACKAGED_OUTPUTPATH|OPENWRT_ARMSR|PACKAGE_SOC|KERNEL_)' \
            || true

          echo
          echo "Workspace files:"
          find "${GITHUB_WORKSPACE}" \
            -maxdepth 4 \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.img.gz' \
              -o -name '*.tar.gz' \
            \) \
            -printf '%p %s bytes\n' \
            | sort \
            || true

          if [ -n "${PACKAGED_OUTPUTPATH:-}" ] && \
             [ -d "${PACKAGED_OUTPUTPATH}" ]; then

            echo
            echo "PACKAGED_OUTPUTPATH:"
            echo "${PACKAGED_OUTPUTPATH}"

            find "${PACKAGED_OUTPUTPATH}" \
              -type f \
              -printf '%p %s bytes\n' \
              | sort
          fi

      # ============================================================
      # 18. Upload complete build logs
      # ============================================================
      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.0-build-logs
          path: |
            /tmp/openwrt-logs/**
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 19. Upload OpenWrt rootfs
      # ============================================================
      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.0-rootfs
          path: |
            flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 20. Upload final N1 firmware
      # ============================================================
      - name: Upload final N1 firmware
        if: success() && env.PACKAGED_OUTPUTPATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.0-flippy
          path: |
            ${{ env.PACKAGED_OUTPUTPATH }}/**
          if-no-files-found: warn
          retention-days: 30

