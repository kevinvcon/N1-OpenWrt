name: Build Phicomm N1 OpenWrt 24.10.8

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8

jobs:
  build:
    name: Build armsr armv8 and package N1 S905D
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout configuration repository
        uses: actions/checkout@v4

      # ============================================================
      # Host environment
      # ============================================================

      - name: Prepare Ubuntu 24.04
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo " Preparing Ubuntu 24.04"
          echo "=============================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            help2man \
            libelf-dev \
            bc \
            pkg-config \
            time \
            xsltproc \
            subversion \
            ccache \
            zstd \
            device-tree-compiler \
            qemu-utils

          echo
          echo "=============================================="
          echo " Host tool versions"
          echo "=============================================="

          gcc --version | head -n 1
          g++ --version | head -n 1
          clang --version | head -n 1
          make --version | head -n 1
          python3 --version
          git --version

          echo
          echo "=============================================="
          echo " Environment sanity check"
          echo "=============================================="

          unset SED || true
          unset GREP_OPTIONS || true

          echo "SED=${SED-}"
          echo "GREP_OPTIONS=${GREP_OPTIONS-}"

          echo
          echo "Disk:"
          df -h

          echo
          echo "Memory:"
          free -h

      # ============================================================
      # Clone OpenWrt
      # ============================================================

      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo " Cloning OpenWrt ${OPENWRT_TAG}"
          echo "=============================================="

          git clone \
            --depth=1 \
            --branch="${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            openwrt

          cd openwrt

          echo
          echo "OpenWrt revision:"
          git describe --tags --always

          echo
          echo "OpenWrt version:"
          grep -E 'VERSION_NUMBER:=' include/version.mk || true

          echo
          echo "Checking armsr target..."

          test -d target/linux/armsr
          test -d target/linux/armsr/armv8
          test -f target/linux/armsr/Makefile

          echo "armsr target: OK"
          echo "armv8 subtarget: OK"

      # ============================================================
      # Feeds
      # ============================================================

      - name: Prepare feeds
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Preparing feeds"
          echo "=============================================="

          cp ../feeds.conf.default ./feeds.conf.default

          echo
          echo "========== feeds.conf.default =========="
          cat feeds.conf.default

          echo
          echo "=============================================="
          echo " Updating feeds"
          echo "=============================================="

          ./scripts/feeds update -a 2>&1 | tee /tmp/feeds-update.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "feeds update exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::feeds update failed"

            echo
            echo "========== FEEDS UPDATE LOG =========="

            tail -n 500 /tmp/feeds-update.log

            exit "${STATUS}"
          fi

          echo
          echo "=============================================="
          echo " Installing feeds"
          echo "=============================================="

          ./scripts/feeds install -a -f 2>&1 | tee /tmp/feeds-install.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "feeds install exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::feeds install failed"

            echo
            echo "========== FEEDS INSTALL LOG =========="

            tail -n 500 /tmp/feeds-install.log

            exit "${STATUS}"
          fi

          echo
          echo "=============================================="
          echo " Installed PassWall packages"
          echo "=============================================="

          find package/feeds -maxdepth 2 \
            \( -iname '*passwall*' -o -iname '*xray*' -o -iname '*sing-box*' -o -iname '*geoview*' \) \
            -print \
            | sort || true

      # ============================================================
      # Configuration
      # ============================================================

      - name: Install .config
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Installing .config"
          echo "=============================================="

          cp ../.config .config

          echo
          echo "========== TARGET =========="

          grep -E '^CONFIG_TARGET_' .config || true

          echo
          echo "========== PASSWALL =========="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box)=' \
            .config || true

          echo
          echo "========== DOCKER =========="

          if grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|runc|docker-compose|docker-compose-v2)=y' \
            .config; then

            echo "::error::Docker package explicitly enabled."

            exit 1
          fi

          echo "Docker packages are not explicitly enabled."

      # ============================================================
      # Defconfig
      # ============================================================

      - name: Run make defconfig
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Running make defconfig"
          echo "=============================================="

          make defconfig 2>&1 | tee /tmp/defconfig.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make defconfig exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::make defconfig FAILED"

            echo
            echo "========== LAST 500 LINES =========="

            tail -n 500 /tmp/defconfig.log

            echo
            echo "========== CONFIG TARGET =========="

            grep -E '^CONFIG_TARGET_' .config || true

            exit "${STATUS}"
          fi

          echo
          echo "make defconfig completed successfully."

      # ============================================================
      # Validate final configuration
      # ============================================================

      - name: Validate final configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Final configuration"
          echo "=============================================="

          echo
          echo "========== TARGET =========="

          grep -E \
            '^CONFIG_TARGET_armsr|^CONFIG_TARGET_ROOTFS' \
            .config \
            || true

          echo
          echo "========== PASSWALL =========="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box)=' \
            .config \
            || true

          echo
          echo "========== PPPoE =========="

          grep -E \
            '^CONFIG_PACKAGE_(ppp|ppp-mod-pppoe|kmod-pppoe|luci-proto-ppp)=' \
            .config \
            || true

          echo
          echo "========== IPV6 =========="

          grep -E \
            '^CONFIG_PACKAGE_(ipv6helper|odhcp6c|odhcpd-ipv6only|luci-proto-ipv6)=' \
            .config \
            || true

          echo
          echo "========== WIREGUARD =========="

          grep -E \
            '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-app-wireguard|luci-proto-wireguard)=' \
            .config \
            || true

          echo
          echo "========== ZEROTIER =========="

          grep -E \
            '^CONFIG_PACKAGE_(zerotier|luci-app-zerotier)=' \
            .config \
            || true

          echo
          echo "========== DOCKER CHECK =========="

          if grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|runc|docker-compose|docker-compose-v2)=y' \
            .config; then

            echo "::error::Docker-related package unexpectedly enabled."

            exit 1
          fi

          echo "Docker packages disabled."

      # ============================================================
      # Download sources
      # ============================================================

      - name: Download OpenWrt sources
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Downloading OpenWrt sources"
          echo "=============================================="

          make download \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee /tmp/download.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make download exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::make download FAILED"

            echo
            echo "========== LAST 500 LINES =========="

            tail -n 500 /tmp/download.log

            echo
            echo "========== DOWNLOAD ERRORS =========="

            grep -nEi \
              'error:|fatal:|failed|cannot|timeout|404|403|checksum|hash mismatch' \
              /tmp/download.log \
              | tail -n 200 \
              || true

            exit "${STATUS}"
          fi

      # ============================================================
      # Build
      # ============================================================

      - name: Build OpenWrt
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Starting OpenWrt build"
          echo "=============================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h .

          echo
          echo "Target:"
          grep -E \
            '^CONFIG_TARGET_armsr|^CONFIG_TARGET_ROOTFS' \
            .config \
            || true

          echo
          echo "=============================================="
          echo " make world"
          echo "=============================================="

          make -j"$(nproc)" world V=s \
            2>&1 | tee /tmp/openwrt-build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "OpenWrt build exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::OpenWrt compilation FAILED"

            echo
            echo "=============================================="
            echo " LAST 500 BUILD LOG LINES"
            echo "=============================================="

            tail -n 500 /tmp/openwrt-build.log

            echo
            echo "=============================================="
            echo " ERROR SEARCH"
            echo "=============================================="

            grep -nEi \
              'error:|fatal:|failed|cannot find|no rule to make|undefined reference|dependency|cannot compile|recipe for target|collected errors|pkg_hash_check_unresolved' \
              /tmp/openwrt-build.log \
              | tail -n 250 \
              || true

            exit "${STATUS}"
          fi

          echo
          echo "=============================================="
          echo " OpenWrt compilation completed successfully"
          echo "=============================================="

      # ============================================================
      # Verify output
      # ============================================================

      - name: Verify OpenWrt rootfs
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Checking OpenWrt output"
          echo "=============================================="

          test -d bin/targets/armsr/armv8

          echo
          echo "Output files:"

          find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          echo
          echo "Rootfs archives:"

          find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -name '*rootfs.tar.gz' \
            -print

          ROOTFS=$(find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)

          if [ -z "${ROOTFS}" ]; then
            echo "::error::No armsr/armv8 rootfs.tar.gz found."

            exit 1
          fi

          echo
          echo "ROOTFS:"
          echo "${ROOTFS}"

          echo
          echo "SHA256:"

          sha256sum "${ROOTFS}"

      # ============================================================
      # Flippy N1 packaging
      # ============================================================

      - name: Package Phicomm N1 S905D with Flippy
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz

          PACKAGE_SOC: s905d

          KERNEL_REPO_URL: breakingbadboy/OpenWrt

          KERNEL_VERSION_NAME: 6.12.y

          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

      # ============================================================
      # Show output
      # ============================================================

      - name: Show final firmware
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo " FINAL OUTPUT"
          echo "=============================================="

          echo
          echo "========== OpenWrt =========="

          find openwrt/bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "========== Flippy =========="

          find /opt/openwrt_packit/output \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null \
            | sort \
            || true

      # ============================================================
      # Upload logs
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-build-logs
          path: |
            /tmp/feeds-update.log
            /tmp/feeds-install.log
            /tmp/defconfig.log
            /tmp/download.log
            /tmp/openwrt-build.log
          if-no-files-found: ignore
          retention-days: 14

      # ============================================================
      # Upload OpenWrt rootfs
      # ============================================================

      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.8-armsr-armv8-rootfs
          path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # Upload N1 firmware
      # ============================================================

      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phicomm-n1-openwrt-24.10.8
          path: /opt/openwrt_packit/output/*
          if-no-files-found: error
          retention-days: 14
