name: Build Phicomm N1 OpenWrt 24.10.8

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8

jobs:

  build:

    name: Build OpenWrt 24.10.8 armsr/armv8

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout GitHub repository
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Install build dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc \
            g++ \
            git \
            gettext \
            gettext-base \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            zlib1g-dev \
            rsync \
            unzip \
            wget \
            curl \
            file \
            help2man \
            bc \
            pkg-config \
            time \
            xsltproc \
            subversion \
            ccache \
            zstd \
            device-tree-compiler \
            qemu-utils \
            python3 \
            python3-setuptools \
            python3-venv \
            perl \
            tar \
            gzip \
            bzip2 \
            xz-utils

          echo "============================================================"
          echo "HOST INFORMATION"
          echo "============================================================"

          uname -a

          echo
          echo "===== GCC ====="
          gcc --version

          echo
          echo "===== G++ ====="
          g++ --version

          echo
          echo "===== MAKE ====="
          make --version

          echo
          echo "===== PYTHON ====="
          python3 --version

          echo
          echo "===== GO ====="
          go version || true

      # ============================================================
      # 3. Clone official OpenWrt 24.10.8
      # ============================================================

      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf openwrt

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            openwrt

          cd openwrt

          echo "============================================================"
          echo "OPENWRT VERSION"
          echo "============================================================"

          git describe --tags --always
          git log -1 --oneline

          echo
          echo "============================================================"
          echo "TARGET CHECK"
          echo "============================================================"

          test -d target/linux/armsr
          test -d target/linux/armsr/armv8

          echo "armsr/armv8 target exists."

      # ============================================================
      # 4. Configure and update feeds
      # ============================================================

      - name: Configure and update feeds
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          cp ../feeds.conf.default feeds.conf.default

          echo "============================================================"
          echo "FEEDS CONFIGURATION"
          echo "============================================================"

          cat feeds.conf.default

          echo
          echo "============================================================"
          echo "UPDATE FEEDS"
          echo "============================================================"

          ./scripts/feeds update -a

          echo
          echo "============================================================"
          echo "INSTALL FEEDS"
          echo "============================================================"

          ./scripts/feeds install -a -f

      # ============================================================
      # 5. Verify PassWall
      # ============================================================

      - name: Verify PassWall packages
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "============================================================"
          echo "PASSWALL PACKAGE CHECK"
          echo "============================================================"

          find feeds/passwall_luci \
            -maxdepth 3 \
            -type f \
            -name Makefile \
            -print \
            | head -100

          echo
          echo "============================================================"
          echo "PASSWALL DEPENDENCY CHECK"
          echo "============================================================"

          find feeds/passwall_packages \
            -maxdepth 2 \
            -type d \
            | grep -E '/(geoview|xray|sing-box)' \
            | head -100 || true

          echo
          echo "============================================================"
          echo "PASSWALL 2 CHECK"
          echo "============================================================"

          if [ -d feeds/passwall2 ]; then
            echo "ERROR: PassWall 2 feed exists."
            exit 1
          fi

          echo "PassWall 2 feed is NOT installed."

      # ============================================================
      # 6. Pin geoview to 0.2.5
      #
      # OpenWrt 24.10 uses Go 1.23.x.
      #
      # Current geoview 0.2.6 requires Go >= 1.25.
      #
      # Therefore use geoview 0.2.5.
      # ============================================================

      - name: Pin geoview to 0.2.5
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "============================================================"
          echo "FIND GEOVIEW"
          echo "============================================================"

          find feeds package \
            -path '*geoview*' \
            -type f \
            -name Makefile \
            -print \
            || true

          echo

          if [ -d "feeds/passwall_packages/geoview" ]; then

            echo "Found PassWall geoview package."

            sed -n '1,180p' \
              feeds/passwall_packages/geoview/Makefile \
              || true

            cp \
              feeds/passwall_packages/geoview/Makefile \
              /tmp/geoview.Makefile.original

            #
            # Change package version.
            #
            sed -i \
              -E 's/^PKG_VERSION:=.*/PKG_VERSION:=0.2.5/' \
              feeds/passwall_packages/geoview/Makefile

            echo
            echo "============================================================"
            echo "PATCHED GEOVIEW MAKEFILE"
            echo "============================================================"

            sed -n '1,180p' \
              feeds/passwall_packages/geoview/Makefile

          else

            echo "ERROR: geoview package was not found."

            find feeds package \
              -type d \
              -name geoview \
              -print \
              || true

            exit 1

          fi

      # ============================================================
      # 7. Copy .config
      # ============================================================

      - name: Install OpenWrt configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          cp ../.config .config

          echo "============================================================"
          echo "ORIGINAL CONFIGURATION"
          echo "============================================================"

          cat .config

      # ============================================================
      # 8. Validate requested configuration
      # ============================================================

      - name: Validate requested configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "============================================================"
          echo "TARGET"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_armsr' \
            .config \
            || true

          echo
          echo "============================================================"
          echo "ROOTFS"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_ROOTFS' \
            .config \
            || true

          echo
          echo "============================================================"
          echo "PASSWALL"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box)=' \
            .config \
            || true

          echo
          echo "============================================================"
          echo "PASSWALL 2"
          echo "============================================================"

          if grep -E \
            '^[[:space:]]*CONFIG_PACKAGE_luci-app-passwall2=' \
            .config
          then
            echo "ERROR: PassWall 2 is enabled."
            exit 1
          fi

          echo "PassWall 2 disabled."

          echo
          echo "============================================================"
          echo "DOCKER"
          echo "============================================================"

          if grep -E \
            '^[[:space:]]*CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|docker-compose|docker-compose-v2)=' \
            .config
          then
            echo "ERROR: Docker package unexpectedly enabled."
            exit 1
          fi

          echo "Docker packages are not enabled."

      # ============================================================
      # 9. Generate final configuration
      # ============================================================

      - name: Run make defconfig
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          make defconfig

          echo "============================================================"
          echo "FINAL CONFIGURATION"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_armsr' \
            .config \
            || true

          echo
          echo "===== PASSWALL ====="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box)' \
            .config \
            || true

          echo
          echo "===== PASSWALL 2 ====="

          grep -E \
            '^CONFIG_PACKAGE_luci-app-passwall2=' \
            .config \
            || echo "PassWall 2 not enabled."

          echo
          echo "===== GEOVIEW ====="

          grep '^PKG_VERSION:=' \
            feeds/passwall_packages/geoview/Makefile \
            || true

      # ============================================================
      # 10. Final configuration validation
      # ============================================================

      - name: Final configuration validation
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "============================================================"
          echo "TARGET VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_TARGET_armsr=y' \
            .config

          grep -q \
            '^CONFIG_TARGET_armsr_armv8=y' \
            .config

          grep -q \
            '^CONFIG_TARGET_armsr_armv8_DEVICE_generic=y' \
            .config

          echo "Target OK."

          echo
          echo "============================================================"
          echo "PASSWALL VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_PACKAGE_luci-app-passwall=y' \
            .config

          echo "PassWall OK."

          echo
          echo "============================================================"
          echo "PASSWALL 2 VALIDATION"
          echo "============================================================"

          if grep -E \
            '^CONFIG_PACKAGE_luci-app-passwall2=' \
            .config
          then
            echo "ERROR: PassWall 2 is enabled."
            exit 1
          fi

          echo "PassWall 2 disabled."

          echo
          echo "============================================================"
          echo "XRAY / SING-BOX VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_PACKAGE_xray-core=y' \
            .config

          grep -q \
            '^CONFIG_PACKAGE_sing-box=y' \
            .config

          echo "Xray/Sing-box OK."

          echo
          echo "============================================================"
          echo "PPPOE VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_PACKAGE_ppp-mod-pppoe=y' \
            .config

          echo "PPPoE OK."

          echo
          echo "============================================================"
          echo "IPV6 VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_PACKAGE_ipv6helper=y' \
            .config

          echo "IPv6 OK."

          echo
          echo "============================================================"
          echo "WIREGUARD VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_PACKAGE_kmod-wireguard=y' \
            .config

          echo "WireGuard OK."

          echo
          echo "============================================================"
          echo "ZEROTIER VALIDATION"
          echo "============================================================"

          grep -q \
            '^CONFIG_PACKAGE_zerotier=y' \
            .config

          echo "ZeroTier OK."

          echo
          echo "============================================================"
          echo "DOCKER VALIDATION"
          echo "============================================================"

          if grep -E \
            '^[[:space:]]*CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|docker-compose|docker-compose-v2)=' \
            .config
          then
            echo "ERROR: Docker package enabled."
            exit 1
          fi

          echo "Docker disabled."

          echo
          echo "============================================================"
          echo "GEOVIEW VALIDATION"
          echo "============================================================"

          GEOVIEW_VERSION="$(
            grep '^PKG_VERSION:=' \
              feeds/passwall_packages/geoview/Makefile \
              | head -1 \
              | cut -d= -f2
          )"

          echo "geoview version: ${GEOVIEW_VERSION}"

          if [ "${GEOVIEW_VERSION}" != "0.2.5" ]; then
            echo "ERROR: geoview is not pinned to 0.2.5."
            exit 1
          fi

          echo "geoview 0.2.5 confirmed."

      # ============================================================
      # 11. Download sources
      # ============================================================

      - name: Download sources
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          mkdir -p /tmp/openwrt-logs

          echo "============================================================"
          echo "DOWNLOAD SOURCES"
          echo "============================================================"

          make download -j2 V=s \
            2>&1 | tee /tmp/openwrt-logs/download.log

      # ============================================================
      # 12. Build OpenWrt
      #
      # -j1 is intentional.
      #
      # It exposes the FIRST actual compilation error.
      # ============================================================

      - name: Build OpenWrt
        shell: bash
        run: |
          set -o pipefail

          cd openwrt

          mkdir -p /tmp/openwrt-logs

          echo "============================================================"
          echo "START OPENWRT BUILD"
          echo "============================================================"

          echo "Build time:"
          date

          echo
          echo "CPU:"
          nproc

          echo
          echo "OpenWrt:"
          git describe --tags --always

          echo
          echo "PassWall:"
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box)=' \
            .config \
            || true

          echo
          echo "PassWall 2:"
          grep -E \
            '^CONFIG_PACKAGE_luci-app-passwall2=' \
            .config \
            || echo "disabled"

          echo
          echo "geoview:"
          grep '^PKG_VERSION:=' \
            feeds/passwall_packages/geoview/Makefile \
            || true

          echo
          echo "============================================================"
          echo "RUN: make -j1 world V=s"
          echo "============================================================"

          make -j1 world V=s \
            2>&1 | tee /tmp/openwrt-logs/build.log

      # ============================================================
      # 13. Diagnose build failure
      # ============================================================

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "OPENWRT BUILD FAILED"
          echo "============================================================"

          if [ -f /tmp/openwrt-logs/build.log ]; then

            echo
            echo "============================================================"
            echo "LAST 300 LINES"
            echo "============================================================"

            tail -n 300 \
              /tmp/openwrt-logs/build.log

            echo
            echo "============================================================"
            echo "ERROR / FAILED / FATAL"
            echo "============================================================"

            grep -nEi \
              'error:|error |failed|fatal|No rule to make|cannot find|not found|requires go|GOTOOLCHAIN' \
              /tmp/openwrt-logs/build.log \
              | tail -n 200 \
              || true

            echo
            echo "============================================================"
            echo "MAKE ERROR SUMMARY"
            echo "============================================================"

            grep -nEi \
              'make\[[0-9]+\].*(Error|error)|world.*Error|package/feeds/.*/compile' \
              /tmp/openwrt-logs/build.log \
              | tail -n 100 \
              || true

          fi

          echo
          echo "============================================================"
          echo "GEOVIEW MAKEFILE"
          echo "============================================================"

          if [ -f openwrt/feeds/passwall_packages/geoview/Makefile ]; then
            cat openwrt/feeds/passwall_packages/geoview/Makefile
          fi

          echo
          echo "============================================================"
          echo "OPENWRT CONFIG"
          echo "============================================================"

          if [ -f openwrt/.config ]; then

            grep -E \
              '^CONFIG_TARGET_|^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box|zerotier|kmod-wireguard)' \
              openwrt/.config \
              | head -n 200

          fi

          exit 1

      # ============================================================
      # 14. Verify OpenWrt output
      # ============================================================

      - name: Verify OpenWrt output
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "============================================================"
          echo "BUILD OUTPUT"
          echo "============================================================"

          find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "============================================================"
          echo "ROOTFS TAR"
          echo "============================================================"

          ROOTFS="$(
            find \
              bin/targets/armsr/armv8 \
              -maxdepth 1 \
              -type f \
              -name '*rootfs.tar.gz' \
              | head -1
          )"

          if [ -z "${ROOTFS}" ]; then
            echo "ERROR: OpenWrt rootfs.tar.gz was not generated."
            exit 1
          fi

          echo "ROOTFS:"
          echo "${ROOTFS}"

          ls -lh "${ROOTFS}"

      # ============================================================
      # 15. Package for Phicomm N1 / S905D
      # ============================================================

      - name: Prepare N1 packaging
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "PREPARE PHICOMM N1 PACKAGING"
          echo "============================================================"

          ls -lh \
            openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz

      # ============================================================
      # 16. OHub / Amlogic S9xxx packaging
      # ============================================================

      - name: Package N1 firmware
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: 6.12.y_6.18.y
          auto_kernel: true
          openwrt_ip: 192.168.1.1

      # ============================================================
      # 17. Show final N1 firmware
      # ============================================================

      - name: Show N1 firmware
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "N1 OUTPUT"
          echo "============================================================"

          if [ -d openwrt/out ]; then

            find openwrt/out \
              -maxdepth 2 \
              -type f \
              -printf '%p\n' \
              | sort

            echo
            echo "============================================================"
            echo "FILE SIZES"
            echo "============================================================"

            find openwrt/out \
              -maxdepth 2 \
              -type f \
              -exec ls -lh {} \;

          else

            echo "openwrt/out does not exist."

          fi

      # ============================================================
      # 18. Upload diagnostic logs
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-build-logs
          path: |
            /tmp/openwrt-logs/
            /tmp/geoview.Makefile.original
            openwrt/.config
            openwrt/feeds/passwall_packages/geoview/Makefile
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 19. Upload OpenWrt rootfs
      # ============================================================

      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-rootfs
          path: |
            openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
            openwrt/bin/targets/armsr/armv8/sha256sums
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. Upload final N1 firmware
      # ============================================================

      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-firmware
          path: |
            openwrt/out/**
          if-no-files-found: error
          retention-days: 30
