name: Build Phicomm N1 OpenWrt 24.10.8

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8

jobs:

  build:

    name: Build N1 S905D - OpenWrt 24.10.8

    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout configuration repository
        uses: actions/checkout@v4


      # ============================================================
      # Prepare Ubuntu
      # ============================================================

      - name: Prepare Ubuntu 24.04
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo " Preparing Ubuntu 24.04"
          echo "=================================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-setuptools \
            python3-venv \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            help2man \
            libelf-dev \
            libdw-dev \
            bc \
            pkg-config \
            time \
            xsltproc \
            subversion \
            ccache \
            zstd \
            device-tree-compiler \
            qemu-utils \
            python3 \
            perl \
            tar \
            gzip \
            bzip2 \
            xz-utils

          echo
          echo "=================================================="
          echo " Host versions"
          echo "=================================================="

          gcc --version | head -n 1
          g++ --version | head -n 1
          clang --version | head -n 1
          make --version | head -n 1
          python3 --version
          git --version

          echo
          echo "=================================================="
          echo " Host resources"
          echo "=================================================="

          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          unset SED || true
          unset GREP_OPTIONS || true


      # ============================================================
      # Clone OpenWrt
      # ============================================================

      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo " Cloning OpenWrt ${OPENWRT_TAG}"
          echo "=================================================="

          git clone \
            --depth=1 \
            --branch="${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            openwrt

          cd openwrt

          echo
          echo "OpenWrt revision:"
          git describe --tags --always

          echo
          echo "OpenWrt version:"
          grep -E 'VERSION_NUMBER:=' include/version.mk || true

          echo
          echo "Checking target:"

          test -d target/linux/armsr
          test -d target/linux/armsr/armv8
          test -f target/linux/armsr/Makefile

          echo "armsr: OK"
          echo "armv8: OK"


      # ============================================================
      # Prepare feeds
      # ============================================================

      - name: Prepare feeds
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=================================================="
          echo " Preparing feeds"
          echo "=================================================="

          cp ../feeds.conf.default ./feeds.conf.default

          echo
          echo "=================================================="
          echo " feeds.conf.default"
          echo "=================================================="

          cat feeds.conf.default

          echo
          echo "=================================================="
          echo " Updating feeds"
          echo "=================================================="

          ./scripts/feeds update -a \
            2>&1 | tee /tmp/feeds-update.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "feeds update exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::feeds update failed"

            echo
            echo "=================================================="
            echo " FEEDS UPDATE LOG"
            echo "=================================================="

            tail -n 1000 /tmp/feeds-update.log

            exit "${STATUS}"
          fi

          echo
          echo "=================================================="
          echo " Installing feeds"
          echo "=================================================="

          ./scripts/feeds install -a -f \
            2>&1 | tee /tmp/feeds-install.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "feeds install exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::feeds install failed"

            echo
            echo "=================================================="
            echo " FEEDS INSTALL LOG"
            echo "=================================================="

            tail -n 1000 /tmp/feeds-install.log

            exit "${STATUS}"
          fi

          echo
          echo "=================================================="
          echo " PassWall packages found"
          echo "=================================================="

          find package/feeds \
            -maxdepth 3 \
            \( \
              -iname '*passwall*' \
              -o -iname '*xray*' \
              -o -iname '*sing-box*' \
              -o -iname '*geoview*' \
            \) \
            -print \
            | sort \
            || true


      # ============================================================
      # Install configuration
      # ============================================================

      - name: Install .config
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=================================================="
          echo " Installing .config"
          echo "=================================================="

          cp ../.config .config

          echo
          echo "=================================================="
          echo " TARGET"
          echo "=================================================="

          grep -E '^CONFIG_TARGET_' .config || true

          echo
          echo "=================================================="
          echo " PASSWALL"
          echo "=================================================="

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box)=' \
            .config \
            || true

          echo
          echo "=================================================="
          echo " DOCKER CHECK"
          echo "=================================================="

          if grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|docker-compose|docker-compose-v2)=y' \
            .config; then

            echo "::error::Docker package explicitly enabled."

            exit 1
          fi

          echo "Docker packages are disabled."


      # ============================================================
      # Defconfig
      # ============================================================

      - name: Run make defconfig
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=================================================="
          echo " Running make defconfig"
          echo "=================================================="

          make defconfig \
            2>&1 | tee /tmp/defconfig.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make defconfig exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::make defconfig FAILED"

            echo
            echo "=================================================="
            echo " DEFCONFIG LOG"
            echo "=================================================="

            tail -n 1000 /tmp/defconfig.log

            exit "${STATUS}"
          fi

          echo
          echo "make defconfig completed successfully."


      # ============================================================
      # Validate final configuration
      # ============================================================

      - name: Validate final configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=================================================="
          echo " FINAL CONFIGURATION"
          echo "=================================================="

          echo
          echo "TARGET:"
          grep -E \
            '^CONFIG_TARGET_armsr|^CONFIG_TARGET_ROOTFS' \
            .config \
            || true

          echo
          echo "PASSWALL:"
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box)=' \
            .config \
            || true

          echo
          echo "PPPoE:"
          grep -E \
            '^CONFIG_PACKAGE_(ppp|ppp-mod-pppoe|kmod-pppoe|luci-proto-ppp)=' \
            .config \
            || true

          echo
          echo "IPv6:"
          grep -E \
            '^CONFIG_PACKAGE_(ipv6helper|odhcp6c|odhcpd-ipv6only|luci-proto-ipv6)=' \
            .config \
            || true

          echo
          echo "WireGuard:"
          grep -E \
            '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-app-wireguard|luci-proto-wireguard)=' \
            .config \
            || true

          echo
          echo "ZeroTier:"
          grep -E \
            '^CONFIG_PACKAGE_(zerotier|luci-app-zerotier)=' \
            .config \
            || true

          echo
          echo "Docker:"
          if grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|docker-compose|docker-compose-v2)=y' \
            .config; then

            echo "::error::Docker-related package unexpectedly enabled."

            exit 1
          fi

          echo "Docker packages disabled."


      # ============================================================
      # Download source packages
      # ============================================================

      - name: Download OpenWrt sources
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=================================================="
          echo " Downloading OpenWrt sources"
          echo "=================================================="

          make download \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee /tmp/download.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "make download exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::make download FAILED"

            echo
            echo "=================================================="
            echo " DOWNLOAD ERRORS"
            echo "=================================================="

            grep -nEi \
              'error:|fatal:|failed|cannot|timeout|404|403|checksum|hash mismatch' \
              /tmp/download.log \
              | tail -n 300 \
              || true

            echo
            echo "=================================================="
            echo " LAST 1000 DOWNLOAD LOG LINES"
            echo "=================================================="

            tail -n 1000 /tmp/download.log

            exit "${STATUS}"
          fi


      # ============================================================
      # Diagnostic build
      #
      # IMPORTANT:
      # First successful build must use -j1.
      # This makes the first real package error visible.
      # ============================================================

      - name: Build OpenWrt - diagnostic mode
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=================================================="
          echo " STARTING OPENWRT BUILD"
          echo "=================================================="

          echo
          echo "Build mode:"
          echo "  make -j1 world V=s"

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h .

          echo
          echo "Target:"
          grep -E \
            '^CONFIG_TARGET_armsr|^CONFIG_TARGET_ROOTFS' \
            .config \
            || true

          echo
          echo "=================================================="
          echo " MAKE WORLD"
          echo "=================================================="

          make -j1 world V=s \
            2>&1 | tee /tmp/openwrt-build.log

          STATUS=${PIPESTATUS[0]}

          echo
          echo "=================================================="
          echo " BUILD EXIT CODE: ${STATUS}"
          echo "=================================================="

          if [ "${STATUS}" -ne 0 ]; then

            echo "::error::OpenWrt compilation FAILED"

            echo
            echo "=================================================="
            echo " FIRST LIKELY ERROR LINES"
            echo "=================================================="

            grep -nEi \
              '(^|[[:space:]])error(:|[[:space:]])|fatal:|failed|cannot find|no rule to make|undefined reference|cannot compile|recipe for target|collected errors|pkg_hash_check_unresolved|dependency|not found|No such file' \
              /tmp/openwrt-build.log \
              | head -n 150 \
              || true

            echo
            echo "=================================================="
            echo " MAKE FAILURE LINES"
            echo "=================================================="

            grep -nE \
              'make(\[[0-9]+\])?: \*\*\*|Error [0-9]+$' \
              /tmp/openwrt-build.log \
              | tail -n 150 \
              || true

            echo
            echo "=================================================="
            echo " PACKAGE COMPILE FAILURE CONTEXT"
            echo "=================================================="

            grep -nEi \
              'package/feeds/|package/libs/|package/network/|package/system/|package/firmware/' \
              /tmp/openwrt-build.log \
              | tail -n 250 \
              || true

            echo
            echo "=================================================="
            echo " LAST 1500 BUILD LOG LINES"
            echo "=================================================="

            tail -n 1500 /tmp/openwrt-build.log

            exit "${STATUS}"
          fi

          echo
          echo "=================================================="
          echo " OPENWRT COMPILATION SUCCESS"
          echo "=================================================="


      # ============================================================
      # Verify rootfs
      # ============================================================

      - name: Verify OpenWrt rootfs
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=================================================="
          echo " VERIFYING OPENWRT OUTPUT"
          echo "=================================================="

          test -d bin/targets/armsr/armv8

          echo
          echo "Output files:"

          find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          echo
          echo "Rootfs archives:"

          find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -name '*rootfs.tar.gz' \
            -print

          ROOTFS=$(find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)

          if [ -z "${ROOTFS}" ]; then

            echo "::error::No armsr/armv8 rootfs.tar.gz found."

            exit 1
          fi

          echo
          echo "ROOTFS:"
          echo "${ROOTFS}"

          echo
          echo "SHA256:"

          sha256sum "${ROOTFS}"


      # ============================================================
      # Package N1 using official OHub Amlogic packager
      #
      # armsr/armv8 generic rootfs
      #          ↓
      #       s905d
      #          ↓
      #      Phicomm N1
      # ============================================================

      - name: Package Phicomm N1 S905D
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          openwrt_kernel: 6.12.y_6.18.y
          auto_kernel: true
          openwrt_ip: 192.168.1.1


      # ============================================================
      # Show final output
      # ============================================================

      - name: Show final firmware
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo " FINAL OUTPUT"
          echo "=================================================="

          echo
          echo "========== OpenWrt =========="

          find openwrt/bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "========== OHub / Flippy =========="

          find openwrt/out \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null \
            | sort \
            || true


      # ============================================================
      # Upload all diagnostic logs
      # ============================================================

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-build-logs
          path: |
            /tmp/feeds-update.log
            /tmp/feeds-install.log
            /tmp/defconfig.log
            /tmp/download.log
            /tmp/openwrt-build.log
          if-no-files-found: ignore
          retention-days: 14


      # ============================================================
      # Upload OpenWrt rootfs
      # ============================================================

      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.8-armsr-armv8-rootfs
          path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # Upload N1 firmware
      # ============================================================

      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phicomm-n1-openwrt-24.10.8
          path: openwrt/out/*
          if-no-files-found: error
          retention-days: 14
