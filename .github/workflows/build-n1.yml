
name: Build N1 OpenWrt 25.12.5

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: /tmp/openwrt-logs

jobs:
  build:
    name: Build OpenWrt for Phicomm N1
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout configuration repository
      # ============================================================
      - name: Checkout configuration
        uses: actions/checkout@v4

      # ============================================================
      # 2. Prepare build environment
      # ============================================================
      - name: Prepare Ubuntu
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            ccache \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            bc \
            quilt \
            ecj \
            fastjar \
            java-propose-classpath \
            default-jdk \
            time

          echo
          echo "Ubuntu:"
          lsb_release -a || true

          echo
          echo "CPU:"
          nproc

          echo
          echo "Disk:"
          df -h

      # ============================================================
      # 3. Initialize logs
      # ============================================================
      - name: Initialize logs
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf "${LOG_DIR}"
          sudo mkdir -p "${LOG_DIR}"
          sudo chmod 777 "${LOG_DIR}"

          echo "Log directory:"
          echo "${LOG_DIR}"

      # ============================================================
      # 4. Clone OpenWrt 25.12.5
      # ============================================================
      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git rev-parse HEAD

          echo
          echo "OpenWrt version:"
          git describe --tags --always || true

      # ============================================================
      # 5. Install .config and feeds
      # ============================================================
      - name: Install configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f .config
          test -f feeds.conf.default

          cp .config "${OPENWRT_DIR}/.config"
          cp feeds.conf.default "${OPENWRT_DIR}/feeds.conf.default"

          echo
          echo "============================================================"
          echo "Initial target configuration"
          echo "============================================================"

          grep -E \
            'CONFIG_TARGET_|CONFIG_TARGET_ROOTFS|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_wireguard|CONFIG_PACKAGE_zerotier|CONFIG_LUCI_LANG' \
            "${OPENWRT_DIR}/.config" || true

      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Updating feeds"
          echo "============================================================"

          ./scripts/feeds update -a 2>&1 \
            | tee "${LOG_DIR}/feeds-update.log"

      # ============================================================
      # 7. Install feeds
      # ============================================================
      - name: Install feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Installing feeds"
          echo "============================================================"

          ./scripts/feeds install -a 2>&1 \
            | tee "${LOG_DIR}/feeds-install.log"

      # ============================================================
      # 8. Validate target
      # ============================================================
      - name: Validate target
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Validating N1 build target"
          echo "============================================================"

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_armsr_armv8_DEVICE_generic=y$'
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y$'

          echo
          echo "Target:"
          grep '^CONFIG_TARGET_' .config

          echo
          echo "Target validation: OK"

      # ============================================================
      # 9. Generate final configuration
      # ============================================================
      - name: Generate defconfig
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Running make defconfig"
          echo "============================================================"

          make defconfig 2>&1 \
            | tee "${LOG_DIR}/defconfig.log"

          echo
          echo "============================================================"
          echo "Final target configuration"
          echo "============================================================"

          grep -E \
            'CONFIG_TARGET_|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_wireguard|CONFIG_PACKAGE_zerotier|CONFIG_PACKAGE_luci-theme-argon|CONFIG_LUCI_LANG' \
            .config || true

          echo
          echo "============================================================"
          echo "Checking required packages"
          echo "============================================================"

          grep -q '^CONFIG_PACKAGE_luci=y$' .config
          grep -q '^CONFIG_PACKAGE_luci-theme-argon=y$'
          grep -q '^CONFIG_PACKAGE_wireguard-tools=y$'
          grep -q '^CONFIG_PACKAGE_zerotier=y'

          echo "Required package configuration: OK"

      # ============================================================
      # 10. Download sources
      # ============================================================
      - name: Download sources
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Downloading source packages"
          echo "============================================================"

          make download -j2 V=s 2>&1 \
            | tee "${LOG_DIR}/download.log"

      # ============================================================
      # 11. Compile OpenWrt
      # ============================================================
      - name: Build OpenWrt
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "Starting OpenWrt build"
          echo "============================================================"

          echo
          echo "CPU:"
          nproc

          echo
          echo "Disk:"
          df -h

          echo
          echo "Build start:"
          date

          make -j"$(nproc)" V=s 2>&1 \
            | tee "${LOG_DIR}/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "Build end:"
          date

          exit "${BUILD_STATUS}"

      # ============================================================
      # 12. Show build failure
      # ============================================================
      - name: Show build failure
        if: failure()
        shell: bash
        run: |
          echo
          echo "============================================================"
          echo "OPENWRT BUILD FAILED"
          echo "============================================================"

          if [ -f "${LOG_DIR}/build.log" ]; then
            echo
            echo "============================================================"
            echo "LAST 300 LINES OF BUILD LOG"
            echo "============================================================"

            tail -n 300 "${LOG_DIR}/build.log"
          fi

          echo
          echo "============================================================"
          echo "LOG FILES"
          echo "============================================================"

          find "${LOG_DIR}" \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

      # ============================================================
      # 13. Locate and validate rootfs
      # ============================================================
      - name: Validate OpenWrt rootfs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Locating OpenWrt ARMv8 rootfs"
          echo "============================================================"

          TARGET_DIR="${OPENWRT_DIR}/bin/targets/armsr/armv8"

          if [ ! -d "${TARGET_DIR}" ]; then
            echo
            echo "ERROR: Target directory does not exist:"
            echo "${TARGET_DIR}"
            exit 1
          fi

          echo
          echo "Generated target files:"
          find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          ROOTFS="$(find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)"

          if [ -z "${ROOTFS}" ]; then
            echo
            echo "ERROR: No rootfs.tar.gz found."
            exit 1
          fi

          echo
          echo "Selected rootfs:"
          echo "${ROOTFS}"

          ROOTFS_SIZE="$(stat -c '%s' "${ROOTFS}")"

          echo
          echo "Rootfs size:"
          echo "${ROOTFS_SIZE} bytes"

          echo
          echo "Testing gzip:"
          gzip -t "${ROOTFS}"
          echo "gzip: OK"

          echo
          echo "Testing tar:"
          tar -tzf "${ROOTFS}" >/dev/null
          echo "tar: OK"

          echo
          echo "Checking root filesystem directories:"

          for DIR in \
            "./bin/" \
            "./etc/" \
            "./lib/" \
            "./root/" \
            "./sbin/" \
            "./usr/"
          do
            if tar -tzf "${ROOTFS}" "${DIR}" >/dev/null 2>&1; then
              echo "OK: ${DIR}"
            else
              echo "ERROR: Missing ${DIR}"
              exit 1
            fi
          done

          echo
          echo "============================================================"
          echo "Checking Flippy minimum rootfs size"
          echo "============================================================"

          if [ "${ROOTFS_SIZE}" -lt 10485760 ]; then
            echo
            echo "ERROR: rootfs is smaller than 10 MiB."
            echo
            echo "This rootfs is too small for the current Flippy packager."
            echo
            echo "This usually means the selected packages were not included."
            echo
            echo "Current rootfs:"
            echo "${ROOTFS_SIZE} bytes"
            echo
            echo "Required:"
            echo "10485760 bytes"
            exit 1
          fi

          echo "Rootfs size check: OK"

          # Normalize the filename expected by Flippy.
          mkdir -p "${GITHUB_WORKSPACE}/flippy-input"

          NORMALIZED_ROOTFS="${GITHUB_WORKSPACE}/flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz"

          cp -f "${ROOTFS}" "${NORMALIZED_ROOTFS}"

          NORMALIZED_SIZE="$(stat -c '%s' "${NORMALIZED_ROOTFS}")"

          echo
          echo "Normalized rootfs:"
          echo "${NORMALIZED_ROOTFS}"

          echo
          echo "Normalized size:"
          echo "${NORMALIZED_SIZE} bytes"

          test "${NORMALIZED_SIZE}" -ge 10485760

          echo "NORMALIZED_ROOTFS=${NORMALIZED_ROOTFS}" >> "${GITHUB_ENV}"

          echo
          echo "============================================================"
          echo "ROOTFS VALIDATION SUCCESS"
          echo "============================================================"

      # ============================================================
      # 14. Show OpenWrt output
      # ============================================================
      - name: Show OpenWrt output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "OpenWrt output"
          echo "============================================================"

          find "${OPENWRT_DIR}/bin/targets" \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

      # ============================================================
      # 15. Package N1 with current Flippy interface
      # ============================================================
      - name: Package N1 with Flippy
        if: success()
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: ${{ env.NORMALIZED_ROOTFS }}

          PACKAGE_SOC: s905d

          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y_6.18.y
          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

          WHOAMI: kevinvcon

          GZIP_IMGS: gz
          SAVE_OPENWRT_ROOTFS: true

      # ============================================================
      # 16. Show Flippy result
      # ============================================================
      - name: Show Flippy output
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Flippy output"
          echo "============================================================"

          echo
          echo "PACKAGED_STATUS=${PACKAGED_STATUS:-unknown}"

          echo
          echo "PACKAGED_OUTPUTPATH=${PACKAGED_OUTPUTPATH:-unknown}"

          echo
          echo "PACKAGED_OUTPUTDATE=${PACKAGED_OUTPUTDATE:-unknown}"

          if [ -n "${PACKAGED_OUTPUTPATH:-}" ] && \
             [ -d "${PACKAGED_OUTPUTPATH}" ]; then

            echo
            echo "Packaged files:"

            find "${PACKAGED_OUTPUTPATH}" \
              -maxdepth 2 \
              -type f \
              -printf '%p %s bytes\n' \
              | sort
          fi

      # ============================================================
      # 17. Upload raw OpenWrt rootfs
      # ============================================================
      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-rootfs
          path: |
            ${{ env.NORMALIZED_ROOTFS }}
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 18. Upload N1 firmware
      # ============================================================
      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-s905d
          path: |
            ${{ env.PACKAGED_OUTPUTPATH }}/*
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 19. Upload complete logs
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-build-logs
          path: |
            /tmp/openwrt-logs/**
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 20. Upload final configuration
      # ============================================================
      - name: Upload final configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-final-config
          path: |
            openwrt/.config
            openwrt/feeds.conf.default
          if-no-files-found: warn
          retention-days: 30

