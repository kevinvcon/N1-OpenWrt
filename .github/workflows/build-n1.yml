name: Build N1 OpenWrt 24.10.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".config"
      - "feeds.conf.default"
      - ".github/workflows/build-n1.yml"

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8
  OPENWRT_DIR: ${{ github.workspace }}/openwrt
  LOG_DIR: ${{ github.workspace }}/build-logs

jobs:
  build:
    name: Build N1 OpenWrt 24.10.8
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Prepare build environment
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "${LOG_DIR}"

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            swig \
            time \
            jq \
            dos2unix

          echo "Build environment ready."

      # ============================================================
      # 3. Validate repository files BEFORE downloading OpenWrt
      # ============================================================
      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Validating repository files"
          echo "============================================================"

          test -f .config
          test -f feeds.conf.default

          echo
          echo "----- .config -----"
          sed -n '1,220p' .config

          echo
          echo "----- feeds.conf.default -----"
          cat feeds.conf.default

          echo
          echo "----- Checking target -----"

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_armsr_armv8_DEVICE_generic=y$' .config

          echo "armsr/armv8 target: OK"

          echo
          echo "----- Checking required PassWall -----"

          grep -q '^CONFIG_PACKAGE_luci-app-passwall=y$' .config
          grep -q '^CONFIG_PACKAGE_xray-core=y$' .config
          grep -q '^CONFIG_PACKAGE_sing-box=y$' .config
          grep -q '^CONFIG_PACKAGE_geoview=y$' .config

          echo "PassWall configuration: OK"

          echo
          echo "----- Checking forbidden packages -----"

          if grep -Eq '^CONFIG_PACKAGE_(luci-app-passwall2|luci-app-openclash|docker|dockerd|containerd|docker-compose|dockerman)(=y|=m)' .config; then
            echo "ERROR: Forbidden package detected."
            grep -E '^CONFIG_PACKAGE_(luci-app-passwall2|luci-app-openclash|docker|dockerd|containerd|docker-compose|dockerman)' .config || true
            exit 1
          fi

          echo "Forbidden package check: OK"

          echo
          echo "----- Checking feeds syntax -----"

          awk '
          NF == 0 { next }
          /^#/ { next }
          $1 != "src-git" && $1 != "src-git-full" && $1 != "src-link" {
              print "Invalid feed syntax on line " NR ": " $0
              exit 1
          }
          ' feeds.conf.default

          echo "feeds.conf.default syntax: OK"

      # ============================================================
      # 4. Clone official OpenWrt 24.10.8
      # ============================================================
      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Cloning official OpenWrt ${OPENWRT_TAG}"
          echo "============================================================"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git log -1 --oneline

      # ============================================================
      # 5. Copy configuration
      # ============================================================
      - name: Install build configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Installing .config and feeds.conf.default"
          echo "============================================================"

          cp "${GITHUB_WORKSPACE}/.config" \
             "${OPENWRT_DIR}/.config"

          cp "${GITHUB_WORKSPACE}/feeds.conf.default" \
             "${OPENWRT_DIR}/feeds.conf.default"

          cd "${OPENWRT_DIR}"

          echo
          echo "Installed .config:"
          sed -n '1,220p' .config

          echo
          echo "Installed feeds:"
          cat feeds.conf.default

      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update feeds
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Updating feeds"
          echo "============================================================"

          ./scripts/feeds update -a \
            2>&1 | tee "${LOG_DIR}/feeds-update.log"

          status=${PIPESTATUS[0]}

          echo
          echo "feeds update exit code: ${status}"

          exit "${status}"

      # ============================================================
      # 7. Install feeds
      # ============================================================
      - name: Install feeds
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Installing feeds"
          echo "============================================================"

          ./scripts/feeds install -a \
            2>&1 | tee "${LOG_DIR}/feeds-install.log"

          status=${PIPESTATUS[0]}

          echo
          echo "feeds install exit code: ${status}"

          exit "${status}"

      # ============================================================
      # 8. Verify PassWall feed
      # ============================================================
      - name: Verify PassWall packages
        shell: bash
        run: |
          set -euo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Verifying PassWall packages"
          echo "============================================================"

          echo
          echo "PassWall packages:"
          find feeds/passwall_packages \
            -maxdepth 2 \
            -type d \
            \( \
              -name "xray-core" \
              -o -name "sing-box" \
              -o -name "geoview" \
              -o -name "tcping" \
              -o -name "v2ray-geodata" \
              -o -name "v2ray-plugin" \
              -o -name "xray-plugin" \
            \) \
            -print | sort

          echo
          echo "PassWall LuCI:"
          test -d feeds/passwall_luci/luci-app-passwall

          echo "PassWall feed verification: OK"

      # ============================================================
      # 9. make defconfig
      # ============================================================
      - name: Run make defconfig
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Running make defconfig"
          echo "============================================================"

          make defconfig \
            2>&1 | tee "${LOG_DIR}/make-defconfig.log"

          status=${PIPESTATUS[0]}

          echo
          echo "make defconfig exit code: ${status}"

          if [ "${status}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "DEFCОNFIG FAILED"
            echo "============================================================"
            echo
            echo "Last 300 lines:"
            tail -n 300 "${LOG_DIR}/make-defconfig.log" || true
            exit "${status}"
          fi

      # ============================================================
      # 10. Show final effective configuration
      # ============================================================
      - name: Show final configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Final effective target configuration"
          echo "============================================================"

          grep -E \
            '^(CONFIG_TARGET_|CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box|geoview|zerotier|wireguard|samba4|nfs-utils))' \
            .config \
            | sort \
            | tee "${LOG_DIR}/final-config.log"

      # ============================================================
      # 11. Download source packages
      # ============================================================
      - name: Download packages
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Downloading package sources"
          echo "============================================================"

          make download -j"$(nproc)" \
            2>&1 | tee "${LOG_DIR}/download.log"

          status=${PIPESTATUS[0]}

          echo
          echo "make download exit code: ${status}"

          if [ "${status}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "DOWNLOAD FAILED"
            echo "============================================================"
            tail -n 300 "${LOG_DIR}/download.log" || true
            exit "${status}"
          fi

      # ============================================================
      # 12. Build OpenWrt
      # ============================================================
      - name: Build OpenWrt
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "START OPENWRT BUILD"
          echo "============================================================"

          START_TIME=$(date +%s)

          make -j"$(nproc)" V=s \
            2>&1 | tee "${LOG_DIR}/build.log"

          status=${PIPESTATUS[0]}

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))

          echo
          echo "Build duration: ${DURATION} seconds"
          echo "Build exit code: ${status}"

          if [ "${status}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "OPENWRT BUILD FAILED"
            echo "============================================================"

            echo
            echo "============================================================"
            echo "LAST 300 LINES OF BUILD LOG"
            echo "============================================================"

            tail -n 300 "${LOG_DIR}/build.log" || true

            echo
            echo "============================================================"
            echo "BUILD OUTPUT TREE"
            echo "============================================================"

            find "${OPENWRT_DIR}/bin" \
              -maxdepth 5 \
              -type f \
              -printf '%p\n' \
              2>/dev/null \
              | sort \
              | tail -n 300 || true

            exit "${status}"
          fi

      # ============================================================
      # 13. Verify ARMv8 rootfs for Flippy
      # ============================================================
      - name: Verify Flippy input
        shell: bash
        run: |
          set -euo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Checking Flippy input"
          echo "============================================================"

          echo
          echo "Target directory:"
          find bin/targets \
            -maxdepth 3 \
            -type d \
            -print \
            | sort

          echo
          echo "Rootfs archives:"
          find bin/targets \
            -type f \
            -name "*rootfs.tar.gz" \
            -print \
            | sort

          ROOTFS="$(find bin/targets \
            -type f \
            -name "*rootfs.tar.gz" \
            | head -n 1)"

          if [ -z "${ROOTFS}" ]; then
            echo
            echo "ERROR: No rootfs.tar.gz was generated."
            exit 1
          fi

          echo
          echo "Flippy rootfs:"
          echo "${ROOTFS}"

          test -s "${ROOTFS}"

          echo
          echo "Rootfs size:"
          du -h "${ROOTFS}"

      # ============================================================
      # 14. Package N1 with Flippy
      # ============================================================
      - name: Package N1 firmware with Flippy
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/*/*/*rootfs.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y_6.18.y
          KERNEL_AUTO_LATEST: true
          OPENWRT_IP: 192.168.1.1

      # ============================================================
      # 15. Collect firmware
      # ============================================================
      - name: Collect firmware and logs
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "Collecting firmware and build logs"
          echo "============================================================"

          mkdir -p "${LOG_DIR}/firmware"
          mkdir -p "${LOG_DIR}/openwrt-output"

          if [ -d "${OPENWRT_DIR}/bin" ]; then
            cp -a "${OPENWRT_DIR}/bin/." \
              "${LOG_DIR}/openwrt-output/" \
              2>/dev/null || true
          fi

          if [ -d "/opt/openwrt_packit/output" ]; then
            cp -a /opt/openwrt_packit/output/. \
              "${LOG_DIR}/firmware/" \
              2>/dev/null || true
          fi

          echo
          echo "============================================================"
          echo "Generated firmware files"
          echo "============================================================"

          find "${LOG_DIR}" \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.img.xz" \
              -o -name "*.img.zst" \
              -o -name "*.tar.gz" \
              -o -name "*.zip" \
            \) \
            -print \
            | sort || true

          echo
          echo "============================================================"
          echo "Build log files"
          echo "============================================================"

          find "${LOG_DIR}" \
            -type f \
            -printf '%p\n' \
            | sort || true

      # ============================================================
      # 16. Upload logs
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 17. Upload firmware
      # ============================================================
      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-firmware
          path: |
            build-logs/firmware/**
            build-logs/openwrt-output/armsr/armv8/**
          if-no-files-found: warn
          retention-days: 14
