name: N1 Target Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          rm -rf openwrt

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            openwrt

          cd openwrt

          echo "=========================================="
          echo " OPENWRT VERSION"
          echo "=========================================="

          git log -1 --oneline
          git describe --tags --always

      - name: Verify clean source
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/openwrt"

          echo "=========================================="
          echo " VERIFY CLEAN SOURCE"
          echo "=========================================="

          if [ -e .config ]; then
            echo "ERROR: OpenWrt source already contains .config"
            exit 1
          fi

          echo
          echo "No .config exists."

          echo
          echo "Checking environment..."

          env | sort

      - name: Create N1 config
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/openwrt"

          echo "=========================================="
          echo " CREATE N1 CONFIG"
          echo "=========================================="

          cat > .config <<'EOF'
CONFIG_TARGET_armvirt=y
CONFIG_TARGET_armvirt_64=y
CONFIG_TARGET_armvirt_64_Default=y
EOF

          echo
          echo "CONFIG BEFORE DEFCONFIG:"
          cat .config

          echo
          echo "Checking..."

          grep -Fxq 'CONFIG_TARGET_armvirt=y' .config
          grep -Fxq 'CONFIG_TARGET_armvirt_64=y' .config
          grep -Fxq 'CONFIG_TARGET_armvirt_64_Default=y' .config

      - name: Run defconfig
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/openwrt"

          echo "=========================================="
          echo " RUN DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo
          echo "=========================================="
          echo " CONFIG AFTER DEFCONFIG"
          echo "=========================================="

          grep -E \
            '^CONFIG_(TARGET|ARCH|CPU_TYPE)' \
            .config \
            || true

      - name: Final validation
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/openwrt"

          echo "=========================================="
          echo " FINAL VALIDATION"
          echo "=========================================="

          cat .config

          echo
          echo "=========================================="
          echo " TARGET"
          echo "=========================================="

          grep -E \
            '^CONFIG_TARGET_' \
            .config \
            || true

          echo
          echo "=========================================="
          echo " ARCH"
          echo "=========================================="

          grep -E \
            '^CONFIG_(ARCH|CPU_TYPE|TARGET_ARCH_PACKAGES)' \
            .config \
            || true

          echo
          echo "=========================================="
          echo " CHECK"
          echo "=========================================="

          grep -Fxq \
            'CONFIG_TARGET_armvirt=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_armvirt_64=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_armvirt_64_Default=y' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_BOARD="armvirt"' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_SUBTARGET="64"' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_PROFILE="Default"' \
            .config

          grep -Fxq \
            'CONFIG_ARCH="aarch64"' \
            .config

          grep -Fxq \
            'CONFIG_CPU_TYPE="cortex-a53"' \
            .config

          grep -Fxq \
            'CONFIG_TARGET_ARCH_PACKAGES="aarch64_cortex-a53"' \
            .config

          if grep -Eq \
            '^CONFIG_TARGET_ath79|^CONFIG_TARGET.*mips|^CONFIG_ARCH="mips"|^CONFIG_TARGET_ARCH_PACKAGES="mips_' \
            .config
          then
            echo
            echo "=========================================="
            echo " MIPS DETECTED"
            echo "=========================================="
            exit 1
          fi

          echo
          echo "=========================================="
          echo " N1 ARM64 TARGET PASSED"
          echo "=========================================="
