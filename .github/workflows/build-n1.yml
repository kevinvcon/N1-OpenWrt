name: Build Phicomm N1 OpenWrt 24.10.8

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8

jobs:
  build:
    name: OpenWrt 24.10.8 armsr armv8 to N1
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout configuration repository
        uses: actions/checkout@v4

      - name: Prepare Ubuntu
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo " Preparing Ubuntu"
          echo "=============================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            rsync \
            unzip \
            zstd \
            file \
            wget \
            curl \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-venv \
            python3-pip \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            libz-dev \
            zlib1g-dev \
            uuid-dev \
            xsltproc \
            libxml-parser-perl \
            libfile-csv-perl \
            libfile-copy-recursive-perl \
            libfile-which-perl \
            libjson-perl \
            liblist-moreutils-perl \
            liblocale-gettext-perl \
            libwww-perl \
            patch \
            pkg-config \
            subversion \
            swig \
            time \
            bc \
            ccache \
            help2man \
            device-tree-compiler \
            mkisofs \
            qemu-utils

          echo
          echo "=============================================="
          echo " Tool versions"
          echo "=============================================="

          gcc --version | head -n 1
          g++ --version | head -n 1
          make --version | head -n 1
          python3 --version
          git --version

      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo " Cloning OpenWrt 24.10.8"
          echo "=============================================="

          git clone \
            --depth=1 \
            --branch="${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            openwrt

          cd openwrt

          echo
          echo "OpenWrt revision:"
          git describe --tags --always

          echo
          echo "Checking armsr target:"
          test -d target/linux/armsr
          echo "armsr target exists"

      - name: Prepare feeds
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Preparing feeds"
          echo "=============================================="

          cp ../feeds.conf.default ./feeds.conf.default

          echo
          echo "feeds.conf.default:"
          cat feeds.conf.default

          echo
          echo "Updating feeds..."

          ./scripts/feeds update -a 2>&1 | tee /tmp/feeds-update.log
          STATUS=${PIPESTATUS[0]}

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::feeds update failed"

            echo
            echo "========== LAST 300 LINES =========="
            tail -n 300 /tmp/feeds-update.log

            exit "${STATUS}"
          fi

          echo
          echo "Installing feeds..."

          ./scripts/feeds install -a -f 2>&1 | tee /tmp/feeds-install.log
          STATUS=${PIPESTATUS[0]}

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::feeds install failed"

            echo
            echo "========== LAST 300 LINES =========="
            tail -n 300 /tmp/feeds-install.log

            exit "${STATUS}"
          fi

      - name: Install configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Installing .config"
          echo "=============================================="

          cp ../.config .config

          echo
          echo "Target configuration:"
          grep -E '^CONFIG_TARGET_' .config || true

          echo
          echo "PassWall configuration:"
          grep -E \
            'CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box)' \
            .config || true

      - name: Verify armsr armv8
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Verifying armsr armv8"
          echo "=============================================="

          test -f target/linux/armsr/Makefile
          test -d target/linux/armsr/armv8

          echo "armsr: OK"
          echo "armv8: OK"

      - name: Run make defconfig
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Running make defconfig"
          echo "=============================================="

          make defconfig 2>&1 | tee /tmp/defconfig.log
          STATUS=${PIPESTATUS[0]}

          echo
          echo "make defconfig exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::make defconfig FAILED"

            echo
            echo "========== LAST 300 LINES =========="
            tail -n 300 /tmp/defconfig.log

            echo
            echo "========== TARGET CONFIG =========="
            grep -E '^CONFIG_TARGET_' .config || true

            exit "${STATUS}"
          fi

          echo
          echo "make defconfig completed successfully."

      - name: Validate configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Final configuration"
          echo "=============================================="

          echo
          echo "TARGET:"
          grep -E '^CONFIG_TARGET_' .config | head -80 || true

          echo
          echo "PASSWALL:"
          grep -E \
            'CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|xray-core|sing-box)' \
            .config || true

          echo
          echo "WIREGUARD:"
          grep -E \
            'CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-app-wireguard)' \
            .config || true

          echo
          echo "ZEROTIER:"
          grep -E \
            'CONFIG_PACKAGE_(zerotier|luci-app-zerotier)' \
            .config || true

          echo
          echo "PPPOE:"
          grep -E \
            'CONFIG_PACKAGE_(ppp|ppp-mod-pppoe|kmod-pppoe)' \
            .config || true

          echo
          echo "IPV6:"
          grep -E \
            'CONFIG_PACKAGE_(ipv6helper|odhcp6c|odhcpd-ipv6only|luci-proto-ipv6)' \
            .config || true

          echo
          echo "DOCKER CHECK:"

          if grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|dockerman|luci-app-dockerman|containerd|docker-compose|docker-compose-v2|runc)=y' \
            .config; then

            echo "::error::Docker-related package unexpectedly enabled."
            exit 1
          else
            echo "Docker packages are disabled."
          fi

      - name: Download sources
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Downloading sources"
          echo "=============================================="

          make download -j"$(nproc)" V=s 2>&1 | tee /tmp/download.log
          STATUS=${PIPESTATUS[0]}

          echo
          echo "make download exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::make download FAILED"

            echo
            echo "========== LAST 300 LINES =========="
            tail -n 300 /tmp/download.log

            exit "${STATUS}"
          fi

      - name: Build OpenWrt
        shell: bash
        run: |
          set +e

          cd openwrt

          echo "=============================================="
          echo " Starting OpenWrt build"
          echo "=============================================="

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h .

          echo
          echo "Target:"
          grep -E \
            '^CONFIG_TARGET_armsr|^CONFIG_TARGET_ROOTFS' \
            .config || true

          echo
          echo "=============================================="
          echo " make world"
          echo "=============================================="

          make -j"$(nproc)" world V=s 2>&1 | tee /tmp/openwrt-build.log
          STATUS=${PIPESTATUS[0]}

          echo
          echo "OpenWrt build exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::OpenWrt compilation FAILED"

            echo
            echo "=============================================="
            echo " LAST 500 BUILD LOG LINES"
            echo "=============================================="

            tail -n 500 /tmp/openwrt-build.log

            echo
            echo "=============================================="
            echo " ERROR SEARCH"
            echo "=============================================="

            grep -nEi \
              'error:|fatal:|failed|cannot find|no rule to make|undefined reference|dependency|cannot compile|recipe for target' \
              /tmp/openwrt-build.log \
              | tail -n 150 || true

            exit "${STATUS}"
          fi

          echo
          echo "OpenWrt compilation completed successfully."

      - name: Verify OpenWrt rootfs
        shell: bash
        run: |
          set -euxo pipefail

          cd openwrt

          echo "=============================================="
          echo " Checking armsr armv8 output"
          echo "=============================================="

          find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          ROOTFS=$(find bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)

          if [ -z "${ROOTFS}" ]; then
            echo "::error::No armsr armv8 rootfs.tar.gz found."
            exit 1
          fi

          echo
          echo "ROOTFS:"
          echo "${ROOTFS}"

          echo
          echo "SHA256:"
          sha256sum "${ROOTFS}"

      - name: Package Phicomm N1 with Flippy
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          OPENWRT_IP: 192.168.1.1
          SAVE_OPENWRT_ROOTFS: true
          GZIP_IMGS: gz

      - name: Show final firmware
        if: always()
        shell: bash
        run: |
          echo "=============================================="
          echo " FINAL OUTPUT"
          echo "=============================================="

          echo
          echo "OpenWrt:"
          find openwrt/bin/targets/armsr/armv8 \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null \
            | sort || true

          echo
          echo "Flippy:"
          find /opt/openwrt_packit/output \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            2>/dev/null \
            | sort || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-build-logs
          path: |
            /tmp/defconfig.log
            /tmp/feeds-update.log
            /tmp/feeds-install.log
            /tmp/download.log
            /tmp/openwrt-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OpenWrt rootfs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.8-armsr-armv8-rootfs
          path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phicomm-n1-openwrt-24.10.8
          path: /opt/openwrt_packit/output/*
          if-no-files-found: error
          retention-days: 14
