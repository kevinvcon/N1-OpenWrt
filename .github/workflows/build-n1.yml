```yaml
name: Build N1 OpenWrt 25.12.5

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: /tmp/openwrt-logs

jobs:
  build:
    name: Build OpenWrt for Phicomm N1
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout configuration
        uses: actions/checkout@v4


      # ============================================================
      # 2. Prepare build environment
      # ============================================================
      - name: Prepare Ubuntu
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            ccache \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            device-tree-compiler \
            bc \
            quilt \
            ecj \
            fastjar \
            java-propose-classpath \
            default-jdk \
            time

          echo
          echo "============================================================"
          echo "BUILD ENVIRONMENT"
          echo "============================================================"

          lsb_release -a || true
          echo
          echo "CPU:"
          nproc
          echo
          echo "DISK:"
          df -h


      # ============================================================
      # 3. Initialize logs
      # ============================================================
      - name: Initialize logs
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf "${LOG_DIR}"
          sudo mkdir -p "${LOG_DIR}"
          sudo chmod 777 "${LOG_DIR}"

          echo "Log directory:"
          ls -ld "${LOG_DIR}"


      # ============================================================
      # 4. Clone official OpenWrt
      # ============================================================
      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "============================================================"
          echo "OPENWRT VERSION"
          echo "============================================================"

          git rev-parse HEAD
          git describe --tags --always || true


      # ============================================================
      # 5. Install repository configuration
      # ============================================================
      - name: Install configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "Checking repository files..."

          test -f .config
          test -f feeds.conf.default

          echo
          echo "============================================================"
          echo "SOURCE .config"
          echo "============================================================"

          grep -E '^CONFIG_TARGET|^CONFIG_TARGET_ROOTFS' .config || true

          echo
          echo "============================================================"
          echo "SOURCE feeds.conf.default"
          echo "============================================================"

          cat feeds.conf.default

          cp .config "${OPENWRT_DIR}/.config"
          cp feeds.conf.default "${OPENWRT_DIR}/feeds.conf.default"

          echo
          echo "Configuration copied successfully."


      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "UPDATING FEEDS"
          echo "============================================================"

          ./scripts/feeds update -a \
            2>&1 | tee "${LOG_DIR}/feeds-update.log"


      # ============================================================
      # 7. Install feeds
      # ============================================================
      - name: Install feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "INSTALLING FEEDS"
          echo "============================================================"

          ./scripts/feeds install -a \
            2>&1 | tee "${LOG_DIR}/feeds-install.log"


      # ============================================================
      # 8. Generate defconfig + FULL TARGET DIAGNOSTICS
      #
      # IMPORTANT:
      # We intentionally DO NOT fail here when
      # CONFIG_TARGET_armsr_armv8 is missing.
      #
      # We need to see what OpenWrt 25.12.5 actually produces
      # after make defconfig.
      # ============================================================
      - name: Generate defconfig and diagnose target
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "RUNNING MAKE DECONFIG"
          echo "============================================================"

          make defconfig \
            2>&1 | tee "${LOG_DIR}/defconfig.log"

          echo
          echo "============================================================"
          echo "FINAL TARGET CONFIG"
          echo "============================================================"

          grep -E '^CONFIG_TARGET(_|=)' .config || true

          echo
          echo "============================================================"
```
