
name: N1 Target Test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 --branch "$OPENWRT_TAG" "$OPENWRT_REPO" openwrt
          cd openwrt
          git log -1 --oneline
          git describe --tags --always

      - name: Create config
        run: |
          cd openwrt

          echo 'CONFIG_TARGET_armvirt=y' > .config
          echo 'CONFIG_TARGET_armvirt_64=y' >> .config
          echo 'CONFIG_TARGET_armvirt_64_Default=y' >> .config

          echo "=========================================="
          echo "CONFIG BEFORE DEFCONFIG"
          echo "=========================================="

          cat .config

      - name: Run defconfig
        run: |
          cd openwrt

          echo "=========================================="
          echo "RUN DEFCONFIG"
          echo "=========================================="

          make defconfig

          echo "=========================================="
          echo "CONFIG AFTER DEFCONFIG"
          echo "=========================================="

          grep '^CONFIG_TARGET_' .config || true
          grep '^CONFIG_ARCH=' .config || true
          grep '^CONFIG_CPU_TYPE=' .config || true
          grep '^CONFIG_TARGET_ARCH_PACKAGES=' .config || true

      - name: Final check
        run: |
          cd openwrt

          echo "=========================================="
          echo "FINAL CHECK"
          echo "=========================================="

          cat .config

          grep 'CONFIG_TARGET_armvirt=y' .config
          grep 'CONFIG_TARGET_armvirt_64=y' .config
          grep 'CONFIG_TARGET_armvirt_64_Default=y' .config

          echo "=========================================="
          echo "N1 TARGET TEST PASSED"
          echo "=========================================="
```
