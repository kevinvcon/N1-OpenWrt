
name: Build N1 OpenWrt 25.12.5 Clean

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: ${{ github.workspace }}/openwrt-logs
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    name: Build OpenWrt 25.12.5 for Phicomm N1
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Prepare build environment
      # ==========================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Prepare Ubuntu build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            time \
            jq \
            ca-certificates \
            curl

          echo
          echo "Ubuntu build dependencies installed."

      # ==========================================================
      # 2. Prepare directories
      # ==========================================================
      - name: Prepare log directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${LOG_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

          echo "LOG_DIR=${LOG_DIR}"
          echo "ARTIFACT_DIR=${ARTIFACT_DIR}"

      # ==========================================================
      # 3. Validate repository .config
      # ==========================================================
      - name: Validate N1 configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Validating .config"
          echo "============================================================"

          if [ ! -f ".config" ]; then
            echo "ERROR: .config not found in repository root."
            exit 1
          fi

          sed -i 's/\r$//' .config

          if grep -nE '```|^\[|^name:|^CONFIG_FILE|https?://' .config; then
            echo
            echo "ERROR: .config appears to contain Markdown/YAML/URL content."
            exit 1
          fi

          required_configs=(
            "CONFIG_TARGET_armsr=y"
            "CONFIG_TARGET_armsr_armv8=y"
            "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y"
          )

          for item in "${required_configs[@]}"; do
            if ! grep -qxF "${item}" .config; then
              echo "ERROR: Missing required config: ${item}"
              exit 1
            fi
          done

          forbidden_configs=(
            "CONFIG_TARGET_ath79"
            "CONFIG_TARGET_armvirt"
            "CONFIG_TARGET_mips"
          )

          for item in "${forbidden_configs[@]}"; do
            if grep -q "^${item}=y" .config; then
              echo "ERROR: Forbidden target detected: ${item}"
              exit 1
            fi
          done

          echo
          echo "N1 target configuration:"
          grep '^CONFIG_TARGET_' .config

          echo
          echo "Selected LuCI packages:"
          grep '^CONFIG_PACKAGE_luci' .config || true

          echo
          echo "Docker / PassWall exclusions:"
          grep -E \
            'CONFIG_PACKAGE_(docker|dockerd|docker-compose|dockerman|containerd|luci-app-passwall|luci-app-passwall2|zerotier)' \
            .config || true

      # ==========================================================
      # 4. Clone official OpenWrt
      # ==========================================================
      - name: Clone OpenWrt 25.12.5
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Cloning official OpenWrt"
          echo "============================================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch="${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git rev-parse HEAD

          echo
          echo "OpenWrt version:"
          git describe --tags --always || true

      # ==========================================================
      # 5. Replace feeds.conf.default
      #
      # Only official packages + luci feeds.
      # No routing / telephony / video / third-party feeds.
      # ==========================================================
      - name: Configure minimal official feeds
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Configuring minimal official feeds"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          cat > feeds.conf.default <<'EOF'
          src-git packages https://git.openwrt.org/feed/packages.git
          src-git luci https://git.openwrt.org/project/luci.git
          EOF

          echo
          echo "feeds.conf.default:"
          cat feeds.conf.default

          echo
          echo "Checking feed configuration..."

          if grep -Eq 'routing|telephony|video|passwall|immortalwrt|lede|kenzok8|small|third' feeds.conf.default; then
            echo "ERROR: Unexpected feed detected."
            exit 1
          fi

      # ==========================================================
      # 6. Update packages feed
      # ==========================================================
      - name: Update official packages feed
        shell: bash
        run: |
          set -u

          cd "${OPENWRT_DIR}"

          LOG="${LOG_DIR}/feeds-packages-update.log"

          echo "============================================================"
          echo "Updating official packages feed"
          echo "============================================================"

          set +e
          ./scripts/feeds update packages 2>&1 | tee "${LOG}"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "PACKAGES FEED UPDATE FAILED"
            echo "Exit code: ${STATUS}"
            echo "============================================================"

            echo
            echo "Last 500 lines:"
            tail -n 500 "${LOG}" || true

            exit "${STATUS}"
          fi

          echo
          echo "packages feed update completed successfully."

      # ==========================================================
      # 7. Update LuCI feed
      # ==========================================================
      - name: Update official LuCI feed
        shell: bash
        run: |
          set -u

          cd "${OPENWRT_DIR}"

          LOG="${LOG_DIR}/feeds-luci-update.log"

          echo "============================================================"
          echo "Updating official LuCI feed"
          echo "============================================================"

          set +e
          ./scripts/feeds update luci 2>&1 | tee "${LOG}"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "LUCI FEED UPDATE FAILED"
            echo "Exit code: ${STATUS}"
            echo "============================================================"

            echo
            echo "Last 500 lines:"
            tail -n 500 "${LOG}" || true

            exit "${STATUS}"
          fi

          echo
          echo "luci feed update completed successfully."

      # ==========================================================
      # 8. Install only packages + luci package definitions
      # ==========================================================
      - name: Install official feed packages
        shell: bash
        run: |
          set -u

          cd "${OPENWRT_DIR}"

          LOG="${LOG_DIR}/feeds-install.log"

          echo "============================================================"
          echo "Installing official packages + luci feeds"
          echo "============================================================"

          set +e

          {
            echo "===== packages ====="
            ./scripts/feeds install -a -p packages

            echo
            echo "===== luci ====="
            ./scripts/feeds install -a -p luci

          } 2>&1 | tee "${LOG}"

          STATUS=${PIPESTATUS[0]}

          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "FEEDS INSTALL FAILED"
            echo "Exit code: ${STATUS}"
            echo "============================================================"

            echo
            echo "Last 500 lines:"
            tail -n 500 "${LOG}" || true

            exit "${STATUS}"
          fi

          echo
          echo "Feed installation completed successfully."

      # ==========================================================
      # 9. Show actual feed status
      # ==========================================================
      - name: Verify feed status
        shell: bash
        run: |
          set -euo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Installed feeds"
          echo "============================================================"

          ./scripts/feeds list

          echo
          echo "Checking unwanted feeds..."

          if [ -d "feeds/routing" ]; then
            echo "ERROR: routing feed exists."
            exit 1
          fi

          if [ -d "feeds/telephony" ]; then
            echo "ERROR: telephony feed exists."
            exit 1
          fi

          if [ -d "feeds/video" ]; then
            echo "ERROR: video feed exists."
            exit 1
          fi

          echo
          echo "Feed verification passed."

      # ==========================================================
      # 10. Copy .config
      # ==========================================================
      - name: Install N1 .config
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Installing N1 .config"
          echo "============================================================"

          cp "${GITHUB_WORKSPACE}/.config" "${OPENWRT_DIR}/.config"

          cd "${OPENWRT_DIR}"

          echo
          echo "Target config before defconfig:"
          grep '^CONFIG_TARGET_' .config

      # ==========================================================
      # 11. Generate defconfig
      # ==========================================================
      - name: Generate and verify defconfig
        shell: bash
        run: |
          set -u

          cd "${OPENWRT_DIR}"

          LOG="${LOG_DIR}/defconfig.log"

          echo "============================================================"
          echo "Running make defconfig"
          echo "============================================================"

          set +e
          make defconfig 2>&1 | tee "${LOG}"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "DEFCONFIG FAILED"
            echo "Exit code: ${STATUS}"
            echo "============================================================"

            tail -n 500 "${LOG}" || true

            exit "${STATUS}"
          fi

          echo
          echo "============================================================"
          echo "Final target configuration"
          echo "============================================================"

          grep '^CONFIG_TARGET_' .config

          echo
          echo "============================================================"
          echo "Hard target verification"
          echo "============================================================"

          grep -qx 'CONFIG_TARGET_armsr=y' .config
          grep -qx 'CONFIG_TARGET_armsr_armv8=y' .config
          grep -qx 'CONFIG_TARGET_armsr_armv8_DEVICE_generic=y'

          echo
          echo "Target verification PASSED."

          echo
          echo "Checking forbidden targets..."

          if grep -Eq '^CONFIG_TARGET_(ath79|armvirt|mips)=y' .config; then
            echo "ERROR: Forbidden target detected after defconfig."
            exit 1
          fi

          echo
          echo "Checking PassWall / Docker..."

          if grep -Eq '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|docker|dockerd|docker-compose|dockerman|containerd)=y' .config; then
            echo "ERROR: Forbidden package enabled."
            exit 1
          fi

          echo
          echo "Configuration verification PASSED."

      # ==========================================================
      # 12. Download sources
      # ==========================================================
      - name: Download OpenWrt sources
        shell: bash
        run: |
          set -u

          cd "${OPENWRT_DIR}"

          LOG="${LOG_DIR}/download.log"

          echo "============================================================"
          echo "Downloading OpenWrt sources"
          echo "============================================================"

          set +e
          make download -j8 V=s 2>&1 | tee "${LOG}"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "SOURCE DOWNLOAD FAILED"
            echo "Exit code: ${STATUS}"
            echo "============================================================"

            tail -n 500 "${LOG}" || true

            exit "${STATUS}"
          fi

          echo
          echo "Source download completed successfully."

      # ==========================================================
      # 13. Build firmware
      # ==========================================================
      - name: Build OpenWrt firmware
        shell: bash
        run: |
          set -u

          cd "${OPENWRT_DIR}"

          LOG="${LOG_DIR}/build.log"

          echo "============================================================"
          echo "Building OpenWrt 25.12.5"
          echo "Target: armsr/armv8/generic"
          echo "============================================================"

          set +e
          make -j2 V=s 2>&1 | tee "${LOG}"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "OPENWRT BUILD FAILED"
            echo "Exit code: ${STATUS}"
            echo "============================================================"

            echo
            echo "Last 300 lines of build.log:"
            tail -n 300 "${LOG}" || true

            exit "${STATUS}"
          fi

          echo
          echo "============================================================"
          echo "OPENWRT BUILD SUCCESS"
          echo "============================================================"

          echo
          echo "Target output directory:"
          find bin/targets -maxdepth 3 -type f -print | sort

      # ==========================================================
      # 14. Verify expected N1 universal rootfs
      # ==========================================================
      - name: Verify armsr rootfs
        shell: bash
        run: |
          set -euo pipefail

          ROOTFS="openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz"

          echo "============================================================"
          echo "Verifying OpenWrt rootfs"
          echo "============================================================"

          if [ ! -f "${ROOTFS}" ]; then
            echo
            echo "ERROR: Expected rootfs not found:"
            echo "${ROOTFS}"
            echo
            echo "Available target files:"
            find openwrt/bin/targets -type f -print | sort
            exit 1
          fi

          echo
          echo "ROOTFS FOUND:"
          ls -lh "${ROOTFS}"

          echo
          echo "SHA256:"
          sha256sum "${ROOTFS}"

      # ==========================================================
      # 15. Package N1 with Flippy
      # ==========================================================
      - name: Package N1 firmware with Flippy
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
          PACKAGE_SOC: s905d
          SCRIPT_S905D: mk_s905d_n1.sh

          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

          SELECT_PACKITPATH: openwrt_packit
          SELECT_OUTPUTPATH: output

          SAVE_OPENWRT_ROOTFS: true
          GZIP_IMGS: .gz

          OPENWRT_VER: 25.12.5
          DISTRIB_DESCRIPTION: OpenWrt N1 25.12.5 Clean
          WHOAMI: OpenWrt-N1

      # ==========================================================
      # 16. Collect all firmware files
      # ==========================================================
      - name: Collect firmware artifacts
        if: always()
        shell: bash
        run: |
          set -u

          echo "============================================================"
          echo "Collecting firmware artifacts"
          echo "============================================================"

          mkdir -p "${ARTIFACT_DIR}"

          echo
          echo "Searching workspace..."

          find "${GITHUB_WORKSPACE}" \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.img.gz' \
              -o -name '*.7z' \
              -o -name '*.zip' \
              -o -name '*rootfs.tar.gz' \
            \) \
            -print \
            > "${ARTIFACT_DIR}/file-list.txt" || true

          cat "${ARTIFACT_DIR}/file-list.txt" || true

          while IFS= read -r file; do
            [ -f "${file}" ] || continue

            base="$(basename "${file}")"

            if [ "${base}" = "file-list.txt" ]; then
              continue
            fi

            cp -f "${file}" "${ARTIFACT_DIR}/${base}" || true
          done < "${ARTIFACT_DIR}/file-list.txt"

          echo
          echo "Artifacts collected:"
          find "${ARTIFACT_DIR}" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      # ==========================================================
      # 17. Collect logs
      # ==========================================================
      - name: Collect build logs
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p "${ARTIFACT_DIR}/logs"

          if [ -d "${LOG_DIR}" ]; then
            cp -a "${LOG_DIR}/." "${ARTIFACT_DIR}/logs/" || true
          fi

          if [ -d "${OPENWRT_DIR}" ]; then
            {
              echo "============================================================"
              echo "OpenWrt Git commit"
              echo "============================================================"
              git -C "${OPENWRT_DIR}" rev-parse HEAD 2>/dev/null || true

              echo
              echo "============================================================"
              echo "Final target"
              echo "============================================================"
              grep '^CONFIG_TARGET_' "${OPENWRT_DIR}/.config" 2>/dev/null || true

              echo
              echo "============================================================"
              echo "Target files"
              echo "============================================================"
              find "${OPENWRT_DIR}/bin/targets" -type f -print 2>/dev/null | sort || true

            } > "${ARTIFACT_DIR}/logs/build-summary.txt"
          fi

      # ==========================================================
      # 18. Upload artifacts
      # ==========================================================
      - name: Upload N1 firmware and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-clean
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: warn
          retention-days: 14

