
name: Build N1 OpenWrt 24.10.8

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8
  OPENWRT_DIR: ${{ github.workspace }}/openwrt
  LOG_DIR: ${{ github.workspace }}/build-logs

jobs:
  build:
    name: Build OpenWrt 24.10.8 armvirt/64 for N1
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. Checkout user repository
      # ==========================================================
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Prepare build environment
      # ==========================================================
      - name: Prepare Ubuntu build environment
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rsync \
            unzip \
            wget \
            curl \
            file \
            zstd \
            xz-utils \
            gzip \
            bzip2 \
            tar \
            ccache \
            swig \
            time \
            help2man \
            libelf-dev \
            libdw-dev \
            elfutils \
            pkg-config \
            autoconf \
            automake \
            libtool \
            device-tree-compiler \
            qemu-utils

          echo "============================================================"
          echo "HOST TOOL VERSIONS"
          echo "============================================================"

          gcc --version
          make --version
          python3 --version
          git --version
          help2man --version || true
          pkg-config --version

      # ==========================================================
      # 3. Create persistent log directory
      # ==========================================================
      - name: Initialize persistent build logs
        shell: bash
        run: |
          set -eux

          mkdir -p "${LOG_DIR}"

          {
            echo "Build started:"
            date -u
            echo
            echo "Runner:"
            uname -a
            echo
            echo "CPU:"
            nproc
            echo
            echo "Memory:"
            free -h
            echo
            echo "Disk:"
            df -h
          } | tee "${LOG_DIR}/environment.txt"

      # ==========================================================
      # 4. Clone exact OpenWrt release
      # ==========================================================
      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "OPENWRT VERSION"
          echo "============================================================"

          git describe --tags --always
          git rev-parse HEAD

          git describe --tags --exact-match

      # ==========================================================
      # 5. Copy user .config
      # ==========================================================
      - name: Install OpenWrt configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f "${GITHUB_WORKSPACE}/.config"

          cp \
            "${GITHUB_WORKSPACE}/.config" \
            "${OPENWRT_DIR}/.config"

          echo "============================================================"
          echo "CONFIG BEFORE DEFCONFIG"
          echo "============================================================"

          grep -E \
            'CONFIG_TARGET_armvirt|CONFIG_TARGET_ROOTFS|CONFIG_PACKAGE_luci-app-passwall|CONFIG_PACKAGE_xray-core|CONFIG_PACKAGE_sing-box|CONFIG_PACKAGE_wireguard|CONFIG_PACKAGE_zerotier|CONFIG_PACKAGE_docker|CONFIG_PACKAGE_dockerd|CONFIG_PACKAGE_containerd|CONFIG_PACKAGE_docker-compose|CONFIG_PACKAGE_luci-app-dockerman|CONFIG_PACKAGE_luci-app-passwall2' \
            "${OPENWRT_DIR}/.config" \
            | tee "${LOG_DIR}/config-before-defconfig.txt" || true

      # ==========================================================
      # 6. Validate feeds file
      # ==========================================================
      - name: Install feeds.conf.default
        shell: bash
        run: |
          set -euxo pipefail

          test -f "${GITHUB_WORKSPACE}/feeds.conf.default"

          cp \
            "${GITHUB_WORKSPACE}/feeds.conf.default" \
            "${OPENWRT_DIR}/feeds.conf.default"

          echo "============================================================"
          echo "FEEDS CONFIGURATION"
          echo "============================================================"

          nl -ba "${OPENWRT_DIR}/feeds.conf.default" \
            | tee "${LOG_DIR}/feeds.conf.default.txt"

          echo
          echo "Checking feed syntax..."

          while IFS= read -r line; do
            case "${line}" in
              ""|\#*)
                continue
                ;;
              src-git\ *)
                ;;
              *)
                echo "ERROR: Invalid feeds.conf.default line:"
                echo "${line}"
                exit 1
                ;;
            esac
          done < "${OPENWRT_DIR}/feeds.conf.default"

      # ==========================================================
      # 7. Update feeds
      # ==========================================================
      - name: Update OpenWrt feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds update -a 2>&1 \
            | tee "${LOG_DIR}/feeds-update.log"

      # ==========================================================
      # 8. Install feeds
      # ==========================================================
      - name: Install OpenWrt feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          ./scripts/feeds install -a 2>&1 \
            | tee "${LOG_DIR}/feeds-install.log"

      # ==========================================================
      # 9. Verify PassWall source tree
      # ==========================================================
      - name: Verify PassWall feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "PASSWALL FEED"
          echo "============================================================"

          test -d "feeds/passwall_luci"
          test -d "feeds/passwall_packages"

          test -d "feeds/passwall_luci/luci-app-passwall"
          test -f "feeds/passwall_luci/luci-app-passwall/Makefile"

          test -d "feeds/passwall_packages/geoview"
          test -f "feeds/passwall_packages/geoview/Makefile"

          test -d "feeds/passwall_packages/xray-core"
          test -d "feeds/passwall_packages/sing-box"

          echo
          echo "PassWall source tree verified."

          echo
          echo "============================================================"
          echo "PASSWALL FILES"
          echo "============================================================"

          find feeds/passwall_luci \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100 \
            | tee "${LOG_DIR}/passwall-luci-files.txt"

          find feeds/passwall_packages \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200 \
            | tee "${LOG_DIR}/passwall-packages-files.txt"

      # ==========================================================
      # 10. Defconfig
      # ==========================================================
      - name: Run OpenWrt defconfig
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          make defconfig 2>&1 \
            | tee "${LOG_DIR}/defconfig.log"

      # ==========================================================
      # 11. Verify final configuration
      # ==========================================================
      - name: Verify final OpenWrt configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          cp .config "${LOG_DIR}/final.config"

          echo "============================================================"
          echo "FINAL TARGET"
          echo "============================================================"

          grep -E \
            '^CONFIG_TARGET_|^CONFIG_ARCH|^CONFIG_CPU_TYPE' \
            .config \
            | tee "${LOG_DIR}/final-target-config.txt"

          echo
          echo "============================================================"
          echo "FINAL PASSWALL CONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|xray-core|sing-box|geoview|tcping|chinadns-ng|dns2socks|ipt2socks|hysteria)' \
            .config \
            | tee "${LOG_DIR}/final-passwall-config.txt" \
            || true

          echo
          echo "============================================================"
          echo "FINAL NETWORK CONFIG"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(ppp|ppp-mod-pppoe|ipv6helper|wireguard-tools|kmod-wireguard|zerotier|luci-app-zerotier)' \
            .config \
            | tee "${LOG_DIR}/final-network-config.txt" \
            || true

          echo
          echo "============================================================"
          echo "DOCKER CHECK"
          echo "============================================================"

          if grep -E \
            '^CONFIG_PACKAGE_(docker|dockerd|containerd|docker-compose)|^CONFIG_PACKAGE_luci-app-dockerman' \
            .config; then

            echo "ERROR: Docker-related package is enabled."
            exit 1
          fi

          echo "Docker ecosystem is disabled."

          echo
          echo "============================================================"
          echo "PASSWALL2 CHECK"
          echo "============================================================"

          if grep -E '^CONFIG_PACKAGE_luci-app-passwall2=y' .config; then
            echo "ERROR: PassWall2 must not be included."
            exit 1
          fi

          echo "PassWall2 is disabled."

      # ==========================================================
      # 12. Download sources
      # ==========================================================
      - name: Download OpenWrt sources
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          make download -j2 V=s 2>&1 \
            | tee "${LOG_DIR}/download.log"

      # ==========================================================
      # 13. Compile
      # ==========================================================
      - name: Build OpenWrt
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "OPENWRT BUILD START"
          echo "============================================================"

          date -u

          make -j"$(nproc)" V=s 2>&1 \
            | tee "${LOG_DIR}/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          echo "${BUILD_STATUS}" \
            > "${LOG_DIR}/build-exit-code.txt"

          echo
          echo "============================================================"
          echo "OPENWRT BUILD EXIT CODE: ${BUILD_STATUS}"
          echo "============================================================"

          if [ "${BUILD_STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "LAST 300 LINES OF BUILD LOG"
            echo "============================================================"

            tail -n 300 "${LOG_DIR}/build.log" \
              | tee "${LOG_DIR}/build-last-300-lines.txt"

            echo
            echo "============================================================"
            echo "FAILED BUILD DIRECTORY"
            echo "============================================================"

            find "${OPENWRT_DIR}/build_dir" \
              -maxdepth 3 \
              -type f \
              -name '*.log' \
              -print \
              2>/dev/null \
              | head -100 \
              | tee "${LOG_DIR}/build-dir-logs.txt"

            exit "${BUILD_STATUS}"
          fi

          echo
          echo "OpenWrt build completed successfully."

      # ==========================================================
      # 14. Validate OpenWrt output
      # ==========================================================
      - name: Validate OpenWrt rootfs output
        if: success()
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "OPENWRT OUTPUT"
          echo "============================================================"

          find bin/targets \
            -type f \
            -printf '%p %s bytes\n' \
            | tee "${LOG_DIR}/openwrt-output.txt"

          ROOTFS_FILES=$(find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | wc -l)

          if [ "${ROOTFS_FILES}" -eq 0 ]; then
            echo "ERROR: No rootfs.tar.gz was generated."
            exit 1
          fi

          ROOTFS=$(find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)

          echo
          echo "ROOTFS:"
          echo "${ROOTFS}"

          SIZE=$(stat -c '%s' "${ROOTFS}")

          echo
          echo "ROOTFS SIZE: ${SIZE} bytes"

          if [ "${SIZE}" -lt 1000000 ]; then
            echo "ERROR: rootfs.tar.gz is suspiciously small."
            exit 1
          fi

          echo
          echo "Testing tar archive..."

          tar -tzf "${ROOTFS}" \
            > "${LOG_DIR}/rootfs-file-list.txt"

          test -s "${LOG_DIR}/rootfs-file-list.txt"

          sha256sum "${ROOTFS}" \
            | tee "${LOG_DIR}/rootfs.sha256"

          echo
          echo "Rootfs archive verified successfully."

      # ==========================================================
      # 15. Upload raw OpenWrt build
      # ==========================================================
      - name: Upload OpenWrt build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-openwrt-rootfs
          path: |
            ${{ env.OPENWRT_DIR }}/bin/targets/armvirt/64/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      # ==========================================================
      # 16. Package with Flippy for Phicomm N1 / S905D
      # ==========================================================
      - name: Package Phicomm N1 S905D firmware
        if: success()
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: ${{ env.OPENWRT_DIR }}/bin/targets/armvirt/64/*rootfs.tar.gz

          PACKAGE_SOC: s905d

          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

          WHOAMI: N1-OpenWrt

          SW_FLOWOFFLOAD: 1
          HW_FLOWOFFLOAD: 0
          SFE_FLOW: 1

          SAVE_OPENWRT_ROOTFS: true

      # ==========================================================
      # 17. Validate Flippy result
      # ==========================================================
      - name: Validate N1 firmware
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "${LOG_DIR}/n1-output"

          echo "============================================================"
          echo "SEARCHING FOR FLIPPY OUTPUT"
          echo "============================================================"

          find /opt \
            -maxdepth 5 \
            -type f \
            \( -name '*.img' -o -name '*.img.gz' -o -name '*.img.xz' -o -name '*.img.zst' \) \
            -printf '%p %s bytes\n' \
            2>/dev/null \
            | tee "${LOG_DIR}/flippy-output.txt"

          echo
          echo "============================================================"
          echo "COPYING N1 IMAGES"
          echo "============================================================"

          find /opt \
            -maxdepth 5 \
            -type f \
            \( -name '*s905d*' -o -name '*n1*' \) \
            \( -name '*.img' -o -name '*.img.gz' -o -name '*.img.xz' -o -name '*.img.zst' \) \
            -exec cp -v {} "${LOG_DIR}/n1-output/" \; \
            2>/dev/null || true

          find "${LOG_DIR}/n1-output" \
            -type f \
            -printf '%f %s bytes\n' \
            | tee "${LOG_DIR}/n1-output-list.txt"

      # ==========================================================
      # 18. Collect ALL diagnostics
      # ==========================================================
      - name: Collect final diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FINAL DIAGNOSTICS"
          echo "============================================================"

          {
            echo "Date:"
            date -u
            echo

            echo "Workspace:"
            pwd
            echo

            echo "Disk:"
            df -h
            echo

            echo "OpenWrt directory:"
            ls -lah "${OPENWRT_DIR}" 2>/dev/null || true
            echo

            echo "Build logs:"
            find "${LOG_DIR}" \
              -maxdepth 3 \
              -type f \
              -printf '%p %s bytes\n' \
              2>/dev/null \
              | sort
          } | tee "${LOG_DIR}/final-diagnostics.txt"

          if [ -f "${LOG_DIR}/build.log" ]; then
            tail -n 300 "${LOG_DIR}/build.log" \
              > "${LOG_DIR}/build-last-300-lines.txt"
          fi

      # ==========================================================
      # 19. ALWAYS upload logs
      # ==========================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-build-logs
          path: |
            ${{ env.LOG_DIR }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          overwrite: true
          include-hidden-files: true

      # ==========================================================
      # 20. Upload N1 firmware
      # ==========================================================
      - name: Upload N1 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-firmware
          path: |
            ${{ env.LOG_DIR }}/n1-output/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
