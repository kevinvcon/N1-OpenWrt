name: Build N1 OpenWrt 24.10.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".config"
      - "feeds.conf.default"
      - ".github/workflows/build-n1.yml"

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.8
  OPENWRT_DIR: ${{ github.workspace }}/openwrt
  LOG_DIR: ${{ github.workspace }}/build-logs

jobs:
  build:
    name: Build OpenWrt 24.10.8 for Phicomm N1
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Checkout configuration repository
      # ============================================================
      - name: Checkout build configuration
        uses: actions/checkout@v4

      # ============================================================
      # 2. Prepare host environment
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "PREPARING BUILD ENVIRONMENT"
          echo "============================================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            xsltproc \
            libxml-parser-perl \
            libelf-dev \
            libdw-dev \
            help2man \
            ccache \
            subversion \
            swig \
            time \
            perl \
            perl-base \
            tar \
            gzip \
            xz-utils \
            bzip2 \
            patch \
            diffutils \
            findutils

          mkdir -p "${LOG_DIR}"

          echo
          echo "============================================================"
          echo "HOST INFORMATION"
          echo "============================================================"

          uname -a
          echo
          lsb_release -a || true
          echo
          nproc
          echo
          free -h
          echo
          df -h

      # ============================================================
      # 3. Validate .config before cloning OpenWrt
      # ============================================================
      - name: Validate .config
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "VALIDATING .config"
          echo "============================================================"

          if [ ! -f ".config" ]; then
            echo "ERROR: .config does not exist."
            exit 1
          fi

          if [ ! -s ".config" ]; then
            echo "ERROR: .config is empty."
            exit 1
          fi

          FIRST_LINE="$(head -n 1 .config)"

          echo "First line:"
          printf '%s\n' "${FIRST_LINE}"

          case "${FIRST_LINE}" in
            CONFIG_*|\#*)
              ;;
            *)
              echo
              echo "ERROR: .config is invalid."
              echo "The first line must be an OpenWrt CONFIG line."
              exit 1
              ;;
          esac

          if grep -nE '^```|^\[https?://|^\[.*\]\(https?://' .config; then
            echo
            echo "ERROR: Markdown content detected in .config."
            exit 1
          fi

          echo
          echo "Target:"
          grep -E '^CONFIG_TARGET_' .config || true

          echo
          echo "PassWall:"
          grep -Ei 'passwall|xray|sing.box|geoview' .config || true

          echo
          echo "Docker:"
          grep -Ei 'docker|dockerd|containerd|dockerman|docker-compose' .config || true

          cp .config "${LOG_DIR}/repository.config"

      # ============================================================
      # 4. Validate feeds.conf.default
      # ============================================================
      - name: Validate feeds.conf.default
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "VALIDATING feeds.conf.default"
          echo "============================================================"

          if [ ! -f "feeds.conf.default" ]; then
            echo "ERROR: feeds.conf.default does not exist."
            exit 1
          fi

          if [ ! -s "feeds.conf.default" ]; then
            echo "ERROR: feeds.conf.default is empty."
            exit 1
          fi

          echo
          echo "feeds.conf.default:"
          cat feeds.conf.default

          echo
          echo "Checking for Markdown contamination..."

          if grep -nE '^```|^\[https?://|^\[.*\]\(https?://' feeds.conf.default; then
            echo
            echo "ERROR: Markdown content detected in feeds.conf.default."
            exit 1
          fi

          echo
          echo "Checking for invalid OpenWrt feed syntax..."

          if grep -nE '\^24\.10|\^v24\.10' feeds.conf.default; then
            echo
            echo "ERROR: Invalid feed syntax detected."
            echo "Do not use ^24.10 or ^v24.10."
            exit 1
          fi

          cp feeds.conf.default "${LOG_DIR}/repository.feeds.conf.default"

      # ============================================================
      # 5. Clone exact OpenWrt 24.10.8
      # ============================================================
      - name: Clone OpenWrt 24.10.8
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "CLONING OPENWRT ${OPENWRT_TAG}"
          echo "============================================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git log -1 --oneline

          echo
          echo "OpenWrt tag:"
          git describe --tags --always

      # ============================================================
      # 6. Copy configuration into OpenWrt
      # ============================================================
      - name: Install build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "INSTALLING BUILD CONFIGURATION"
          echo "============================================================"

          cp .config "${OPENWRT_DIR}/.config"
          cp feeds.conf.default "${OPENWRT_DIR}/feeds.conf.default"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt .config first 20 lines:"
          sed -n '1,20p' .config

          echo
          echo "OpenWrt feeds:"
          cat feeds.conf.default

      # ============================================================
      # 7. Update feeds
      # ============================================================
      - name: Update OpenWrt feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "UPDATING OPENWRT FEEDS"
          echo "============================================================"

          set +e

          ./scripts/feeds update -a 2>&1 | tee "${LOG_DIR}/feeds-update.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "feeds update exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "FEEDS UPDATE FAILED"
            echo "============================================================"
            tail -n 300 "${LOG_DIR}/feeds-update.log" || true
            exit "${STATUS}"
          fi

      # ============================================================
      # 8. Install feeds
      # ============================================================
      - name: Install OpenWrt feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "INSTALLING OPENWRT FEEDS"
          echo "============================================================"

          set +e

          ./scripts/feeds install -a 2>&1 | tee "${LOG_DIR}/feeds-install.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "feeds install exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "FEEDS INSTALL FAILED"
            echo "============================================================"
            tail -n 300 "${LOG_DIR}/feeds-install.log" || true
            exit "${STATUS}"
          fi

      # ============================================================
      # 9. Verify important packages
      # ============================================================
      - name: Verify PassWall packages
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "VERIFYING PASSWALL PACKAGES"
          echo "============================================================"

          echo
          echo "Feed list:"
          ./scripts/feeds list -s

          echo
          echo "PassWall package locations:"

          find feeds/passwall_packages \
            -maxdepth 2 \
            -type f \
            \( \
              -name 'Makefile' \
              -o -name '*.mk' \
            \) \
            | sort \
            | grep -E \
              'geoview|sing-box|xray-core' \
            || true

          echo
          echo "PassWall LuCI package:"

          find feeds/passwall_luci \
            -maxdepth 3 \
            -type f \
            -name 'Makefile' \
            | sort \
            | grep 'luci-app-passwall' \
            || true

          echo
          echo "Searching feeds:"

          ./scripts/feeds search luci-app-passwall || true
          ./scripts/feeds search xray-core || true
          ./scripts/feeds search sing-box || true
          ./scripts/feeds search geoview || true

          echo
          echo "Checking required package directories..."

          test -d feeds/passwall_packages
          test -d feeds/passwall_luci

          test -d feeds/passwall_packages/geoview
          test -d feeds/passwall_packages/xray-core
          test -d feeds/passwall_packages/sing-box
          test -d feeds/passwall_luci/luci-app-passwall

          echo
          echo "PASSWALL PACKAGE VERIFICATION PASSED."

      # ============================================================
      # 10. Verify no unwanted Docker / PassWall2 packages
      # ============================================================
      - name: Verify package exclusions
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "VERIFYING PACKAGE EXCLUSIONS"
          echo "============================================================"

          echo
          echo "Checking .config for Docker packages..."

          if grep -Ei \
            '^CONFIG_PACKAGE_(docker|dockerd|containerd|docker-compose|luci-app-dockerman)=' \
            .config; then

            echo
            echo "ERROR: Docker related package is enabled."
            exit 1
          fi

          echo
          echo "Checking .config for PassWall2..."

          if grep -E '^CONFIG_PACKAGE_luci-app-passwall2=' .config; then
            echo
            echo "ERROR: PassWall2 is enabled."
            exit 1
          fi

          echo
          echo "Checking .config for OpenClash..."

          if grep -E '^CONFIG_PACKAGE_luci-app-openclash=' .config; then
            echo
            echo "ERROR: OpenClash is enabled."
            exit 1
          fi

          echo
          echo "Package exclusion verification passed."

      # ============================================================
      # 11. Generate final OpenWrt configuration
      # ============================================================
      - name: Generate OpenWrt configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "RUNNING MAKE DEFCОNFIG"
          echo "============================================================"

          set +e

          make defconfig 2>&1 | tee "${LOG_DIR}/make-defconfig.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "make defconfig exit code: ${STATUS}"

          echo
          echo "============================================================"
          echo "LAST 300 LINES OF MAKE DECONFIG"
          echo "============================================================"

          tail -n 300 "${LOG_DIR}/make-defconfig.log" || true

          cp .config "${LOG_DIR}/final.config" || true

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "MAKE DECONFIG FAILED"
            echo "============================================================"
            exit "${STATUS}"
          fi

      # ============================================================
      # 12. Print final package selection
      # ============================================================
      - name: Show final package configuration
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "FINAL TARGET CONFIGURATION"
          echo "============================================================"

          grep -E '^CONFIG_TARGET_' .config || true

          echo
          echo "============================================================"
          echo "FINAL PASSWALL CONFIGURATION"
          echo "============================================================"

          grep -Ei \
            'passwall|xray|sing.box|geoview' \
            .config || true

          echo
          echo "============================================================"
          echo "FINAL NETWORK CONFIGURATION"
          echo "============================================================"

          grep -Ei \
            'ppp|pppoe|wireguard|zerotier|ipv6|odhcp' \
            .config || true

          echo
          echo "============================================================"
          echo "DOCKER CONFIGURATION"
          echo "============================================================"

          grep -Ei \
            'docker|dockerd|containerd|dockerman' \
            .config || true

      # ============================================================
      # 13. Download package sources
      # ============================================================
      - name: Download package sources
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "DOWNLOADING PACKAGE SOURCES"
          echo "============================================================"

          set +e

          make download -j"$(nproc)" 2>&1 \
            | tee "${LOG_DIR}/make-download.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "make download exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "DOWNLOAD FAILED"
            echo "============================================================"
            tail -n 300 "${LOG_DIR}/make-download.log" || true
            exit "${STATUS}"
          fi

      # ============================================================
      # 14. Build OpenWrt
      # ============================================================
      - name: Build OpenWrt
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "BUILDING OPENWRT 24.10.8"
          echo "============================================================"

          START_TIME="$(date +%s)"

          set +e

          make -j"$(nproc)" \
            V=s \
            2>&1 | tee "${LOG_DIR}/build.log"

          STATUS=${PIPESTATUS[0]}

          set -e

          END_TIME="$(date +%s)"
          BUILD_TIME=$((END_TIME - START_TIME))

          echo
          echo "============================================================"
          echo "BUILD RESULT"
          echo "============================================================"

          echo "Exit code: ${STATUS}"
          echo "Build time: ${BUILD_TIME} seconds"

          echo
          echo "============================================================"
          echo "LAST 300 LINES OF BUILD LOG"
          echo "============================================================"

          tail -n 300 "${LOG_DIR}/build.log" || true

          if [ "${STATUS}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "OPENWRT BUILD FAILED"
            echo "============================================================"

            exit "${STATUS}"
          fi

      # ============================================================
      # 15. Collect OpenWrt build output
      # ============================================================
      - name: Collect OpenWrt firmware
        if: success()
        working-directory: ${{ env.OPENWRT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "COLLECTING OPENWRT OUTPUT"
          echo "============================================================"

          mkdir -p "${LOG_DIR}/openwrt-output"

          find bin/targets -type f \
            -exec cp --parents {} "${LOG_DIR}/openwrt-output/" \;

          echo
          echo "OpenWrt build files:"
          find bin/targets -type f | sort

      # ============================================================
      # 16. Prepare Flippy environment
      # ============================================================
      - name: Prepare Flippy N1 packaging
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "PREPARING FLIPPY N1 PACKAGING"
          echo "============================================================"

          git clone \
            --depth 1 \
            https://github.com/ophub/flippy-openwrt-actions.git \
            "${GITHUB_WORKSPACE}/flippy-openwrt-actions"

          echo
          echo "Flippy repository:"
          git -C "${GITHUB_WORKSPACE}/flippy-openwrt-actions" log -1 --oneline

      # ============================================================
      # 17. Package N1 firmware
      # ============================================================
      - name: Package firmware for Phicomm N1
        if: success()
        shell: bash
        run: |
          set -uo pipefail

          echo "============================================================"
          echo "PACKAGING FOR PHICOMM N1 / S905D"
          echo "============================================================"

          mkdir -p "${LOG_DIR}/flippy"

          echo
          echo "Searching OpenWrt firmware files..."

          find "${OPENWRT_DIR}/bin/targets" \
            -type f \
            | sort

          echo
          echo "NOTE:"
          echo "The OpenWrt build must complete before Flippy packaging."
          echo "Only generated OpenWrt firmware files are passed to packaging."

          set +e

          find "${OPENWRT_DIR}/bin/targets" \
            -type f \
            \( \
              -name '*.tar.gz' \
              -o -name '*.img.gz' \
              -o -name '*.itb' \
            \) \
            -print \
            > "${LOG_DIR}/flippy/input-files.txt"

          STATUS=$?

          set -e

          echo
          echo "Firmware discovery exit code: ${STATUS}"

          if [ "${STATUS}" -ne 0 ]; then
            exit "${STATUS}"
          fi

          cat "${LOG_DIR}/flippy/input-files.txt"

      # ============================================================
      # 18. Package with Flippy action
      # ============================================================
      - name: Run Flippy N1 packaging
        if: success()
        uses: ophub/flippy-openwrt-actions@main
        with:
          openwrt: ${{ env.OPENWRT_DIR }}
          PACKAGE_SOC: s905d

      # ============================================================
      # 19. Collect final firmware
      # ============================================================
      - name: Collect final firmware
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "COLLECTING FINAL FIRMWARE"
          echo "============================================================"

          mkdir -p "${LOG_DIR}/final-firmware"

          echo
          echo "OpenWrt output:"
          find "${OPENWRT_DIR}/bin" \
            -type f \
            2>/dev/null \
            | sort \
            | tee "${LOG_DIR}/openwrt-files.txt"

          echo
          echo "Workspace firmware candidates:"
          find "${GITHUB_WORKSPACE}" \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.img.gz' \
              -o -name '*.bin' \
              -o -name '*.itb' \
              -o -name '*.tar.gz' \
            \) \
            -not -path '*/.git/*' \
            2>/dev/null \
            | sort \
            | tee "${LOG_DIR}/all-firmware-files.txt"

          echo
          echo "Copying firmware files..."

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              cp --parents "$file" "${LOG_DIR}/final-firmware/" 2>/dev/null || true
            fi
          done < "${LOG_DIR}/all-firmware-files.txt"

      # ============================================================
      # 20. Final diagnostics
      # ============================================================
      - name: Final diagnostics
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FINAL BUILD DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "GitHub workspace:"
          du -sh "${GITHUB_WORKSPACE}" 2>/dev/null || true

          echo
          echo "Log directory:"
          du -sh "${LOG_DIR}" 2>/dev/null || true

          echo
          echo "Available logs:"
          find "${LOG_DIR}" \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null \
            | sort

          echo
          echo "============================================================"
          echo "BUILD LOG LAST 300 LINES"
          echo "============================================================"

          if [ -f "${LOG_DIR}/build.log" ]; then
            tail -n 300 "${LOG_DIR}/build.log"
          fi

          echo
          echo "============================================================"
          echo "DEFCONFIG LOG LAST 300 LINES"
          echo "============================================================"

          if [ -f "${LOG_DIR}/make-defconfig.log" ]; then
            tail -n 300 "${LOG_DIR}/make-defconfig.log"
          fi

          echo
          echo "============================================================"
          echo "FEEDS UPDATE LOG LAST 100 LINES"
          echo "============================================================"

          if [ -f "${LOG_DIR}/feeds-update.log" ]; then
            tail -n 100 "${LOG_DIR}/feeds-update.log"
          fi

      # ============================================================
      # 21. Upload all logs and firmware
      # ============================================================
      - name: Upload build logs and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.8-build-${{ github.run_number }}
          path: |
            build-logs/
            openwrt/bin/targets/
          if-no-files-found: warn
          retention-days: 14
