name: Build N1 OpenWrt (Official 25.12.5)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'feeds.conf.default'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-dev rsync subversion swig time xsltproc zlib1g-dev help2man

      - name: Clone OpenWrt Source (25.12.5)
        run: |
          git clone -b openwrt-25.12 --depth=1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout v25.12.5

      - name: Copy Config Files
        run: |
          cp ${{ github.workspace }}/.config openwrt/.config
          cp ${{ github.workspace }}/feeds.conf.default openwrt/feeds.conf.default

      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Target and SSL Dependencies
        run: |
          cd openwrt
          make defconfig
          # 验证 Target
          if ! grep -q "^CONFIG_TARGET_armsr_armv8_Generic=y" .config; then
            echo "❌ 致命错误：Target 配置未生效！"
            grep '^CONFIG_TARGET_' .config
            exit 1
          fi
          # 验证 uhttpd 和 SSL 库
          if ! grep -q "^CONFIG_PACKAGE_uhttpd=y" .config || ! grep -q "^CONFIG_PACKAGE_libustream-openssl=y" .config; then
            echo "❌ 致命错误：uhttpd 或 SSL 依赖丢失！"
            exit 1
          fi
          echo "✅ Target 与 SSL 依赖验证通过！"

      - name: Compile the Firmware
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Organize Firmware Files
        run: |
          cd openwrt
          mkdir -p output
          cp bin/targets/armsr/armv8/*.tar.gz output/ 2>/dev/null || true
          cp bin/targets/armsr/armv8/*.img.gz output/ 2>/dev/null || true
          cp bin/targets/armsr/armv8/*.img output/ 2>/dev/null || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-25.12.5-Firmware
          path: openwrt/output/*
          if-no-files-found: error
