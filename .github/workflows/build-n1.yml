
name: Build N1 OpenWrt 25.12.5

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: ${{ github.workspace }}/openwrt-logs
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    name: Build OpenWrt for Phicomm N1
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout configuration
        uses: actions/checkout@v4


      # ============================================================
      # 2. Ubuntu 24.04 build environment
      #
      # IMPORTANT:
      # Do NOT install python3-distutils.
      # It does not exist on Ubuntu 24.04.
      #
      # Do NOT install libfile-csv-perl.
      # It caused a previous apt exit 100.
      # ============================================================
      - name: Prepare Ubuntu
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            help2man \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            liblzma-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ca-certificates \
            ccache \
            xsltproc \
            libxml-parser-perl \
            device-tree-compiler \
            bc \
            time \
            quilt \
            ecj \
            fastjar \
            default-jdk \
            bzip2 \
            gzip \
            tar \
            xz-utils \
            zstd \
            pkg-config

          echo
          echo "============================================================"
          echo "BUILD ENVIRONMENT"
          echo "============================================================"

          echo "Ubuntu:"
          lsb_release -a || true

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Git:"
          git --version


      # ============================================================
      # 3. Initialize logs
      # ============================================================
      - name: Initialize logs
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${LOG_DIR}"
          rm -rf "${ARTIFACT_DIR}"

          mkdir -p "${LOG_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

          echo "Workspace:"
          pwd

          echo
          echo "LOG_DIR:"
          echo "${LOG_DIR}"

          echo
          echo "ARTIFACT_DIR:"
          echo "${ARTIFACT_DIR}"


      # ============================================================
      # 4. Clone official OpenWrt 25.12.5
      # ============================================================
      - name: Clone OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "============================================================"
          echo "OPENWRT VERSION"
          echo "============================================================"

          git rev-parse HEAD
          git describe --tags --always

          test "$(git describe --tags --exact-match HEAD)" = "${OPENWRT_TAG}"

          echo
          echo "OpenWrt tag check: PASS"


      # ============================================================
      # 5. Install repository configuration
      # ============================================================
      - name: Install configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "CHECK REPOSITORY FILES"
          echo "============================================================"

          test -f .config
          test -f feeds.conf.default

          echo
          echo "Repository .config:"
          sed -n '1,240p' .config

          echo
          echo "Repository feeds.conf.default:"
          cat feeds.conf.default

          echo
          echo "============================================================"
          echo "VALIDATE CONFIG FILE FORMAT"
          echo "============================================================"

          if grep -nE '```|\[https?://|https?://.*\]' .config feeds.conf.default; then
            echo "ERROR: Markdown or malformed URL detected."
            exit 1
          fi

          cp .config "${OPENWRT_DIR}/.config"
          cp feeds.conf.default "${OPENWRT_DIR}/feeds.conf.default"

          echo
          echo "Configuration copy: PASS"


      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "UPDATE FEEDS"
          echo "============================================================"

          ./scripts/feeds update -a \
            2>&1 | tee "${LOG_DIR}/feeds-update.log"


      # ============================================================
      # 7. Install official feeds
      # ============================================================
      - name: Install official feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "INSTALL OFFICIAL FEEDS"
          echo "============================================================"

          ./scripts/feeds install -a \
            2>&1 | tee "${LOG_DIR}/feeds-install-official.log"


      # ============================================================
      # 8. Install PassWall packages with priority
      #
      # PassWall's own README recommends:
      # passwall_packages
      # passwall_luci
      #
      # Force install these feeds so their package definitions win.
      # ============================================================
      - name: Install PassWall feeds
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "INSTALL PASSWALL PACKAGES"
          echo "============================================================"

          ./scripts/feeds install -a -f -p passwall_packages \
            2>&1 | tee "${LOG_DIR}/feeds-install-passwall-packages.log"

          echo
          echo "============================================================"
          echo "INSTALL PASSWALL LUCI"
          echo "============================================================"

          ./scripts/feeds install -a -f -p passwall_luci \
            2>&1 | tee "${LOG_DIR}/feeds-install-passwall-luci.log"

          echo
          echo "============================================================"
          echo "CHECK PASSWALL"
          echo "============================================================"

          test -e package/feeds/passwall_luci/luci-app-passwall/Makefile
          test -e package/feeds/passwall_packages/xray-core/Makefile
          test -e package/feeds/passwall_packages/sing-box/Makefile

          echo "PassWall feed check: PASS"


      # ============================================================
      # 9. Add Argon
      # ============================================================
      - name: Add Argon theme
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "${OPENWRT_DIR}/package/luci-theme-argon"

          git clone \
            --depth=1 \
            https://github.com/jerrykuku/luci-theme-argon.git \
            "${OPENWRT_DIR}/package/luci-theme-argon"

          test -f "${OPENWRT_DIR}/package/luci-theme-argon/Makefile"

          echo
          echo "Argon source: PASS"


      # ============================================================
      # 10. Generate defconfig
      # ============================================================
      - name: Generate defconfig
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "MAKE DECONFIG"
          echo "============================================================"

          make defconfig \
            2>&1 | tee "${LOG_DIR}/defconfig.log"


      # ============================================================
      # 11. HARD target verification
      #
      # This step intentionally fails if the build accidentally
      # becomes armvirt, ath79, mips, carambola2, etc.
      # ============================================================
      - name: Verify N1 target
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "FINAL TARGET"
          echo "============================================================"

          grep -E '^CONFIG_TARGET|^CONFIG_ARCH' .config \
            | tee "${LOG_DIR}/target-config.log"

          echo
          echo "============================================================"
          echo "REQUIRED TARGET"
          echo "============================================================"

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8_DEVICE_generic=y$'
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y$'

          echo
          echo "============================================================"
          echo "FORBIDDEN TARGET CHECK"
          echo "============================================================"

          if grep -q '^CONFIG_TARGET_armvirt=y$' .config; then
            echo "ERROR: armvirt target detected."
            exit 1
          fi

          if grep -q '^CONFIG_TARGET_ath79=y$' .config; then
            echo "ERROR: ath79 target detected."
            exit 1
          fi

          if grep -q '^CONFIG_TARGET_mips=y$' .config; then
            echo "ERROR: mips target detected."
            exit 1
          fi

          if grep -q 'carambola2' .config; then
            echo "ERROR: carambola2 detected."
            exit 1
          fi

          echo
          echo "TARGET CHECK: PASS"

          echo
          echo "============================================================"
          echo "PASSWALL COMPONENTS"
          echo "============================================================"

          grep '^CONFIG_PACKAGE_luci-app-passwall' .config || true

          echo
          echo "============================================================"
          echo "UNWANTED RUST / EXTRA COMPONENTS"
          echo "============================================================"

          grep -E \
            '^CONFIG_PACKAGE_(shadowsocks-rust|geoview|haproxy|shadow-tls|simple-obfs|v2ray-plugin)' \
            .config \
            || true


      # ============================================================
      # 12. Check target directory before compiling
      # ============================================================
      - name: Verify build configuration
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "OPENWRT TARGET DIRECTORY"
          echo "============================================================"

          test -d target/linux/armsr
          test -d target/linux/armsr/image

          echo "armsr target source: PASS"

          echo
          echo "Expected output:"
          echo "bin/targets/armsr/armv8/"


      # ============================================================
      # 13. Download source packages
      # ============================================================
      - name: Download OpenWrt sources
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "MAKE DOWNLOAD"
          echo "============================================================"

          make download -j8 V=s \
            2>&1 | tee "${LOG_DIR}/download.log"


      # ============================================================
      # 14. Compile OpenWrt
      #
      # First production build uses -j2 deliberately.
      # If this fails, build.log identifies the actual package.
      # ============================================================
      - name: Compile OpenWrt
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -o pipefail

          echo "============================================================"
          echo "START OPENWRT COMPILATION"
          echo "============================================================"

          echo "Build parallelism: -j2"

          make -j2 V=s \
            2>&1 | tee "${LOG_DIR}/build.log"


      # ============================================================
      # 15. Verify OpenWrt rootfs
      # ============================================================
      - name: Verify OpenWrt rootfs
        shell: bash
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -euxo pipefail

          TARGET_DIR="bin/targets/armsr/armv8"

          echo "============================================================"
          echo "OPENWRT OUTPUT"
          echo "============================================================"

          test -d "${TARGET_DIR}"

          ls -lah "${TARGET_DIR}"

          echo
          echo "============================================================"
          echo "ROOTFS TAR.GZ"
          echo "============================================================"

          ROOTFS=$(find "${TARGET_DIR}" \
            -maxdepth 1 \
            -type f \
            -name 'openwrt-armsr-armv8-generic-rootfs.tar.gz' \
            | head -n 1)

          test -n "${ROOTFS}"
          test -f "${ROOTFS}"

          echo "ROOTFS:"
          echo "${ROOTFS}"

          echo
          echo "SIZE:"
          ls -lh "${ROOTFS}"

          echo
          echo "GZIP TEST:"
          gzip -t "${ROOTFS}"

          echo
          echo "TAR TEST:"
          tar -tzf "${ROOTFS}" >/dev/null

          echo
          echo "ROOTFS INTEGRITY: PASS"

          cp "${ROOTFS}" \
            "${ARTIFACT_DIR}/openwrt-armsr-armv8-generic-rootfs.tar.gz"


      # ============================================================
      # 16. Package N1 with current Flippy Action
      #
      # IMPORTANT:
      # "with" contains ONLY "mode".
      # All Flippy parameters are ENV.
      # ============================================================
      - name: Package Phicomm N1
        uses: ophub/flippy-openwrt-actions@main
        with:
          mode: flippy
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz

          PACKAGE_SOC: s905d

          KERNEL_REPO_URL: ophub/kernel
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

          GZIP_IMGS: .gz

          SELECT_PACKITPATH: openwrt_packit
          SELECT_OUTPUTPATH: output

          SAVE_OPENWRT_ROOTFS: true

          SCRIPT_S905D: mk_s905d_n1.sh

          OPENWRT_VER: 25.12.5
          DISTRIB_DESCRIPTION: OpenWrt N1 25.12.5
          WHOAMI: OpenWrt-N1

          SW_FLOWOFFLOAD: 1
          HW_FLOWOFFLOAD: 0
          SFE_FLOW: 1


      # ============================================================
      # 17. Verify Flippy output
      # ============================================================
      - name: Verify N1 firmware
        if: always()
        shell: bash
        run: |
          set +e

          OUTPUT="/opt/openwrt_packit/output"

          echo "============================================================"
          echo "FLIPPY OUTPUT"
          echo "============================================================"

          if [ -d "${OUTPUT}" ]; then
            find "${OUTPUT}" \
              -maxdepth 2 \
              -type f \
              -printf '%p\n' \
              | sort

            echo
            echo "Output directory:"
            ls -lah "${OUTPUT}"
          else
            echo "Flippy output directory does not exist."
          fi


      # ============================================================
      # 18. Collect logs
      # ============================================================
      - name: Collect logs and firmware
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "COLLECT ARTIFACTS"
          echo "============================================================"

          mkdir -p "${ARTIFACT_DIR}"

          if [ -d "${LOG_DIR}" ]; then
            cp -a "${LOG_DIR}/." \
              "${ARTIFACT_DIR}/" \
              2>/dev/null || true
          fi

          if [ -d "${OPENWRT_DIR}/bin/targets/armsr/armv8" ]; then
            mkdir -p "${ARTIFACT_DIR}/openwrt-target"

            cp -a \
              "${OPENWRT_DIR}/bin/targets/armsr/armv8/." \
              "${ARTIFACT_DIR}/openwrt-target/" \
              2>/dev/null || true
          fi

          if [ -d /opt/openwrt_packit/output ]; then
            mkdir -p "${ARTIFACT_DIR}/n1-firmware"

            cp -a \
              /opt/openwrt_packit/output/. \
              "${ARTIFACT_DIR}/n1-firmware/" \
              2>/dev/null || true
          fi

          echo
          echo "============================================================"
          echo "ARTIFACT TREE"
          echo "============================================================"

          find "${ARTIFACT_DIR}" \
            -maxdepth 4 \
            -type f \
            -printf '%p\n' \
            | sort || true


      # ============================================================
      # 19. Upload artifacts
      #
      # ALWAYS upload, including failed builds.
      # ============================================================
      - name: Upload firmware and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-build-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

