
name: Build N1 OpenWrt 25.12.5 Clean

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: ${{ github.workspace }}/openwrt-logs

jobs:
  build:
    name: Build OpenWrt 25.12.5 for N1
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Prepare build environment
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            libelf-dev \
            liblzma-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            subversion \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ca-certificates \
            xsltproc \
            libxml-parser-perl \
            device-tree-compiler \
            bc \
            time \
            quilt \
            ecj \
            fastjar \
            default-jdk \
            bzip2 \
            gzip \
            tar \
            xz-utils \
            zstd \
            pkg-config

          mkdir -p "${LOG_DIR}"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"

          echo
          echo "Build environment ready."

      # ============================================================
      # 2. Checkout repository
      # ============================================================
      - name: Checkout N1 build configuration
        uses: actions/checkout@v4

      # ============================================================
      # 3. Validate configuration
      # ============================================================
      - name: Validate build configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Validating repository configuration"
          echo "============================================================"

          test -f .config

          echo
          echo "Normalizing .config line endings..."

          sed -i 's/\r$//' .config

          echo
          echo "Checking for Markdown contamination..."

          if grep -nE '^```|^\s*```' .config; then
            echo "ERROR: .config contains Markdown code fences."
            exit 1
          fi

          if grep -nE '\[.*\]\(https?://' .config; then
            echo "ERROR: .config contains Markdown URLs."
            exit 1
          fi

          echo
          echo "Target configuration:"
          grep -E '^CONFIG_TARGET_(armsr|TARGET_ROOTFS)' .config || true

          echo
          echo "Checking exact N1 target..."

          TARGET_OK=1

          grep -q '^CONFIG_TARGET_armsr=y$' .config || TARGET_OK=0
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config || TARGET_OK=0
          grep -q '^CONFIG_TARGET_armsr_armv8_DEVICE_generic=y$' .config || TARGET_OK=0

          if [ "${TARGET_OK}" -ne 1 ]; then
            echo
            echo "ERROR: Expected armsr/armv8/generic target was not found."
            echo
            echo "Actual target configuration:"
            grep '^CONFIG_TARGET_' .config || true
            exit 1
          fi

          echo
          echo "N1 target configuration is correct."

          echo
          echo "Checking unwanted components..."

          for CONFIG_LINE in \
            'CONFIG_PACKAGE_luci-app-passwall=n' \
            'CONFIG_PACKAGE_luci-app-passwall2=n' \
            'CONFIG_PACKAGE_zerotier=n' \
            'CONFIG_PACKAGE_docker=n' \
            'CONFIG_PACKAGE_dockerd=n' \
            'CONFIG_PACKAGE_docker-compose=n' \
            'CONFIG_PACKAGE_dockerman=n' \
            'CONFIG_PACKAGE_containerd=n'
          do
            if grep -q "^${CONFIG_LINE}$" .config; then
              echo "OK: ${CONFIG_LINE}"
            else
              echo "INFO: ${CONFIG_LINE} not explicitly present."
            fi
          done

          echo
          echo "============================================================"
          echo "CONFIG VALIDATION PASSED"
          echo "============================================================"

      # ============================================================
      # 4. Clone official OpenWrt
      # ============================================================
      - name: Clone official OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Cloning official OpenWrt"
          echo "============================================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git rev-parse HEAD

          echo
          echo "OpenWrt version:"
          git describe --tags --always

      # ============================================================
      # 5. Install .config
      # ============================================================
      - name: Install OpenWrt configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Installing .config"
          echo "============================================================"

          cp "${GITHUB_WORKSPACE}/.config" \
             "${OPENWRT_DIR}/.config"

          test -f "${OPENWRT_DIR}/.config"

          echo
          echo "Configuration copied successfully."

      # ============================================================
      # 6. Use official OpenWrt feeds only
      # ============================================================
      - name: Verify official feeds
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Using official OpenWrt feeds only"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          test -f feeds.conf.default

          echo
          echo "Official feeds.conf.default:"
          cat feeds.conf.default

          echo
          echo "No PassWall feed."
          echo "No third-party feed."
          echo "No custom feed."

      # ============================================================
      # 7. Update official feeds
      # ============================================================
      - name: Update official feeds
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Updating official OpenWrt feeds"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          ./scripts/feeds update -a \
            2>&1 | tee "${LOG_DIR}/feeds-update.log"

      # ============================================================
      # 8. Install official feeds
      # ============================================================
      - name: Install official feeds
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Installing official OpenWrt feeds"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          ./scripts/feeds install -a \
            2>&1 | tee "${LOG_DIR}/feeds-install.log"

      # ============================================================
      # 9. Generate defconfig
      # ============================================================
      - name: Generate defconfig
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Running make defconfig"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          make defconfig \
            2>&1 | tee "${LOG_DIR}/defconfig.log"

      # ============================================================
      # 10. HARD target verification after defconfig
      # ============================================================
      - name: Verify final OpenWrt target
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "VERIFYING FINAL TARGET"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          echo
          echo "Target configuration:"
          grep '^CONFIG_TARGET_' .config || true

          echo
          echo "Checking armsr / armv8 / generic..."

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8_DEVICE_generic=y$' .config

          if grep -q '^CONFIG_TARGET_ath79=y$' .config; then
            echo "ERROR: ath79 target detected."
            exit 1
          fi

          if grep -q '^CONFIG_TARGET_ramips=y$' .config; then
            echo "ERROR: ramips target detected."
            exit 1
          fi

          if grep -q '^CONFIG_TARGET_armvirt=y$' .config; then
            echo "ERROR: armvirt target detected."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FINAL TARGET: armsr / armv8 / generic"
          echo "============================================================"

      # ============================================================
      # 11. Verify clean package selection
      # ============================================================
      - name: Verify clean package selection
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "VERIFYING CLEAN PACKAGE SELECTION"
          echo "============================================================"

          for PACKAGE_NAME in \
            luci-app-passwall \
            luci-app-passwall2 \
            zerotier \
            docker \
            dockerd \
            docker-compose \
            dockerman \
            containerd
          do
            if grep -q "^CONFIG_PACKAGE_${PACKAGE_NAME}=y$" .config; then
              echo
              echo "ERROR: unwanted package selected:"
              echo "${PACKAGE_NAME}"
              exit 1
            fi
          done

          echo
          echo "No PassWall / ZeroTier / Docker packages selected."

      # ============================================================
      # 12. Download source packages
      # ============================================================
      - name: Download OpenWrt sources
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Downloading OpenWrt sources"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          make download -j8 V=s \
            2>&1 | tee "${LOG_DIR}/download.log"

      # ============================================================
      # 13. Compile OpenWrt
      # ============================================================
      - name: Compile OpenWrt
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "START OPENWRT BUILD"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          make -j2 V=s \
            2>&1 | tee "${LOG_DIR}/build.log"

      # ============================================================
      # 14. Verify OpenWrt output
      # ============================================================
      - name: Verify OpenWrt output
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "VERIFYING OPENWRT OUTPUT"
          echo "============================================================"

          cd "${OPENWRT_DIR}"

          OUTPUT_DIR="bin/targets/armsr/armv8"

          test -d "${OUTPUT_DIR}"

          echo
          echo "Generated files:"
          find "${OUTPUT_DIR}" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          ROOTFS="$(find "${OUTPUT_DIR}" \
            -maxdepth 1 \
            -type f \
            -name 'openwrt-armsr-armv8-generic-rootfs.tar.gz' \
            | head -n 1)"

          if [ -z "${ROOTFS}" ]; then
            echo
            echo "ERROR: Expected N1 rootfs archive was not found."
            echo
            echo "Available tar.gz files:"
            find "${OUTPUT_DIR}" \
              -maxdepth 1 \
              -type f \
              -name '*.tar.gz' \
              -print \
              | sort
            exit 1
          fi

          echo
          echo "N1 ROOTFS FOUND:"
          echo "${ROOTFS}"

          ls -lh "${ROOTFS}"

          cp "${ROOTFS}" \
             "${GITHUB_WORKSPACE}/artifacts/"

      # ============================================================
      # 15. Package with Flippy for Phicomm N1
      # ============================================================
      - name: Package N1 firmware with Flippy
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: openwrt/bin/targets/armsr/armv8/openwrt-armsr-armv8-generic-rootfs.tar.gz
          PACKAGE_SOC: s905d

          SCRIPT_S905D: mk_s905d_n1.sh

          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true

          OPENWRT_IP: 192.168.1.1

          SELECT_PACKITPATH: openwrt_packit
          SELECT_OUTPUTPATH: output

          SAVE_OPENWRT_ROOTFS: true
          GZIP_IMGS: .gz

          OPENWRT_VER: 25.12.5
          DISTRIB_DESCRIPTION: OpenWrt N1 25.12.5 Clean
          WHOAMI: OpenWrt-N1

      # ============================================================
      # 16. Collect Flippy output
      # ============================================================
      - name: Collect N1 firmware
        if: always()
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "COLLECTING FLIPPY OUTPUT"
          echo "============================================================"

          mkdir -p "${GITHUB_WORKSPACE}/artifacts"

          echo
          echo "Searching workspace for generated N1 images..."

          find "${GITHUB_WORKSPACE}" \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.img.gz' \
              -o -name '*.7z' \
              -o -name '*.zip' \
            \) \
            -print \
            2>/dev/null \
            | tee "${LOG_DIR}/flippy-images-found.log"

          echo
          echo "Searching for Flippy output directories..."

          find "${GITHUB_WORKSPACE}" \
            -type d \
            -name output \
            -print \
            2>/dev/null \
            | tee "${LOG_DIR}/flippy-output-dirs.log"

          echo
          echo "Copying generated images to artifacts..."

          find "${GITHUB_WORKSPACE}" \
            -type f \
            \( \
              -name '*.img' \
              -o -name '*.img.gz' \
              -o -name '*.7z' \
              -o -name '*.zip' \
            \) \
            -not -path "${GITHUB_WORKSPACE}/artifacts/*" \
            -exec cp -n {} "${GITHUB_WORKSPACE}/artifacts/" \; \
            2>/dev/null || true

          echo
          echo "Artifacts directory:"
          find "${GITHUB_WORKSPACE}/artifacts" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # 17. Collect build logs
      # ============================================================
      - name: Collect build logs
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "${GITHUB_WORKSPACE}/artifacts/build-logs"

          cp -a "${LOG_DIR}/." \
            "${GITHUB_WORKSPACE}/artifacts/build-logs/" \
            2>/dev/null || true

          if [ -f "${OPENWRT_DIR}/.config" ]; then
            cp "${OPENWRT_DIR}/.config" \
              "${GITHUB_WORKSPACE}/artifacts/build-logs/final-openwrt.config"
          fi

          if [ -f "${OPENWRT_DIR}/feeds.conf.default" ]; then
            cp "${OPENWRT_DIR}/feeds.conf.default" \
              "${GITHUB_WORKSPACE}/artifacts/build-logs/official-feeds.conf"
          fi

          echo
          echo "Final artifact tree:"
          find "${GITHUB_WORKSPACE}/artifacts" \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # 18. Upload firmware and logs
      # ============================================================
      - name: Upload N1 firmware and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-25.12.5-clean
          path: artifacts/
          if-no-files-found: warn
          compression-level: 6

