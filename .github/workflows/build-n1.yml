
name: Build N1 OpenWrt 24.10.0 + Flippy

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v24.10.0
  OPENWRT_DIR: openwrt
  LOG_DIR: /tmp/openwrt-logs

jobs:
  build:
    name: Build OpenWrt 24.10.0 for N1
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout configuration repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Prepare build environment
      # ============================================================
      - name: Prepare build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-distutils \
            rsync \
            unzip \
            wget \
            curl \
            file \
            swig \
            time \
            xsltproc \
            zlib1g-dev \
            libelf-dev \
            device-tree-compiler \
            bc \
            ccache \
            dos2unix \
            tar \
            gzip \
            xz-utils \
            zstd

          mkdir -p "${LOG_DIR}"

          echo "Build environment ready."

      # ============================================================
      # 3. Clone OpenWrt 24.10.0
      # ============================================================
      - name: Clone OpenWrt 24.10.0
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Cloning OpenWrt ${OPENWRT_TAG}"
          echo "============================================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth=1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo "OpenWrt commit:"
          git log -1 --oneline

      # ============================================================
      # 4. Install configuration
      # ============================================================
      - name: Install OpenWrt configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Installing .config"
          echo "============================================================"

          test -f .config || {
            echo "ERROR: repository .config not found"
            exit 1
          }

          cp .config "${OPENWRT_DIR}/.config"

          echo "Installed configuration:"
          grep -E \
            'CONFIG_TARGET_(armsr|TARGET_DEVICE)|CONFIG_TARGET_ROOTFS_TARGZ' \
            "${OPENWRT_DIR}/.config" || true

      # ============================================================
      # 5. Install feeds configuration
      # ============================================================
      - name: Install feeds.conf.default
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Installing feeds.conf.default"
          echo "============================================================"

          test -f feeds.conf.default || {
            echo "ERROR: feeds.conf.default not found"
            exit 1
          }

          cp feeds.conf.default \
            "${OPENWRT_DIR}/feeds.conf.default"

          echo
          echo "feeds.conf.default:"
          cat "${OPENWRT_DIR}/feeds.conf.default"

      # ============================================================
      # 6. Update feeds
      # ============================================================
      - name: Update OpenWrt feeds
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Updating OpenWrt feeds"
          echo "============================================================"

          ./scripts/feeds update -a \
            2>&1 | tee "${LOG_DIR}/feeds-update.log"

      # ============================================================
      # 7. Pin LuCI to exact commit 1ce5e1b
      # ============================================================
      - name: Pin LuCI to git-25.092.38476-1ce5e1b
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Pinning LuCI"
          echo "============================================================"

          test -d feeds/luci/.git

          cd feeds/luci

          git fetch --depth=1 origin 1ce5e1b

          git checkout --detach 1ce5e1b

          echo
          echo "LuCI commit:"
          git log -1 --format='%H %ad %s' --date=iso

          test "$(git rev-parse --short HEAD)" = "1ce5e1b"

          cd ../..

          echo
          echo "LuCI pinned successfully."

      # ============================================================
      # 8. Install feeds
      # ============================================================
      - name: Install OpenWrt feeds
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Installing OpenWrt feeds"
          echo "============================================================"

          ./scripts/feeds install -a \
            2>&1 | tee "${LOG_DIR}/feeds-install.log"

      # ============================================================
      # 9. Validate target
      # ============================================================
      - name: Validate target configuration
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Validating target"
          echo "============================================================"

          grep -q '^CONFIG_TARGET_armsr=y$' .config
          grep -q '^CONFIG_TARGET_armsr_armv8=y$' .config
          grep -q '^CONFIG_TARGET_DEVICE_armsr_armv8_DEVICE_generic=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_TARGZ=y$'

          echo "Target validation passed."

      # ============================================================
      # 10. Defconfig
      # ============================================================
      - name: Generate defconfig
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Running defconfig"
          echo "============================================================"

          make defconfig \
            2>&1 | tee "${LOG_DIR}/defconfig.log"

      # ============================================================
      # 11. Show final important configuration
      # ============================================================
      - name: Show final configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "FINAL TARGET CONFIGURATION"
          echo "============================================================"

          grep -E \
            'CONFIG_TARGET_|CONFIG_TARGET_ROOTFS_|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_zerotier|CONFIG_PACKAGE_wireguard|CONFIG_PACKAGE_ppp' \
            .config | sort

          echo
          echo "============================================================"
          echo "LUCi VERSION"
          echo "============================================================"

          git -C feeds/luci log -1 \
            --format='%H%n%ad%n%s' \
            --date=iso

      # ============================================================
      # 12. Download sources
      # ============================================================
      - name: Download OpenWrt sources
        shell: bash
        run: |
          set -o pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Downloading package sources"
          echo "============================================================"

          make download -j2 \
            2>&1 | tee "${LOG_DIR}/download.log"

      # ============================================================
      # 13. Compile OpenWrt
      # ============================================================
      - name: Compile OpenWrt
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "START OPENWRT BUILD"
          echo "============================================================"

          START_TIME="$(date +%s)"

          make -j"$(nproc)" V=s \
            2>&1 | tee "${LOG_DIR}/openwrt-build.log"

          BUILD_STATUS="${PIPESTATUS[0]}"

          END_TIME="$(date +%s)"
          BUILD_TIME="$((END_TIME - START_TIME))"

          echo
          echo "============================================================"
          echo "BUILD FINISHED"
          echo "Exit code: ${BUILD_STATUS}"
          echo "Build time: ${BUILD_TIME} seconds"
          echo "============================================================"

          if [ "${BUILD_STATUS}" -ne 0 ]; then

            echo
            echo "============================================================"
            echo "OPENWRT BUILD FAILED"
            echo "============================================================"

            echo
            echo "Last 300 lines:"
            tail -n 300 "${LOG_DIR}/openwrt-build.log" || true

            echo
            echo "============================================================"
            echo "Possible ERROR lines"
            echo "============================================================"

            grep -nEi \
              'error:|error |failed|fatal|undefined reference|cannot find|No such file|recipe for target' \
              "${LOG_DIR}/openwrt-build.log" \
              | tail -n 200 || true

            exit "${BUILD_STATUS}"
          fi

      # ============================================================
      # 14. Locate Flippy input
      # ============================================================
      - name: Locate Flippy rootfs
        shell: bash
        run: |
          set -euxo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Locating rootfs.tar.gz for Flippy"
          echo "============================================================"

          find bin/targets \
            -type f \
            \( -name '*rootfs.tar.gz' -o -name '*.tar.gz' \) \
            -print

          ROOTFS="$(find bin/targets \
            -type f \
            -name '*rootfs.tar.gz' \
            | head -n 1)"

          if [ -z "${ROOTFS}" ]; then
            echo "ERROR: No rootfs.tar.gz generated."
            exit 1
          fi

          echo "Found:"
          echo "${ROOTFS}"

          mkdir -p "${GITHUB_WORKSPACE}/flippy-input"

          cp "${ROOTFS}" \
            "${GITHUB_WORKSPACE}/flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz"

          ls -lh \
            "${GITHUB_WORKSPACE}/flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz"

      # ============================================================
      # 15. Package N1 with current Flippy interface
      # ============================================================
      - name: Package N1 with Flippy
        uses: ophub/flippy-openwrt-actions@main
        env:
          OPENWRT_ARMSR: flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz
          PACKAGE_SOC: s905d
          KERNEL_REPO_URL: breakingbadboy/OpenWrt
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true
          OPENWRT_IP: 192.168.1.1
          WHOAMI: Kevin-N1

      # ============================================================
      # 16. List generated images
      # ============================================================
      - name: List Flippy output
        if: always()
        shell: bash
        run: |
          echo "============================================================"
          echo "FLIPPY OUTPUT"
          echo "============================================================"

          if [ -n "${PACKAGED_OUTPUTPATH:-}" ] && \
             [ -d "${PACKAGED_OUTPUTPATH}" ]; then

            find "${PACKAGED_OUTPUTPATH}" \
              -maxdepth 2 \
              -type f \
              -printf '%p %s bytes\n' \
              | sort

          else
            echo "PACKAGED_OUTPUTPATH is not available."
          fi

      # ============================================================
      # 17. Upload build logs
      # ============================================================
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.0-build-logs
          path: |
            /tmp/openwrt-logs/**
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 18. Upload OpenWrt rootfs
      # ============================================================
      - name: Upload OpenWrt rootfs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.0-rootfs
          path: |
            flippy-input/openwrt-armsr-armv8-generic-rootfs.tar.gz
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 19. Upload Flippy generated firmware
      # ============================================================
      - name: Upload N1 firmware artifact
        if: success() && env.PACKAGED_OUTPUTPATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: n1-openwrt-24.10.0-flippy
          path: |
            ${{ env.PACKAGED_OUTPUTPATH }}/**
          if-no-files-found: warn
          retention-days: 30

