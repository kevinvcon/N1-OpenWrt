name: Build N1 OpenWrt (Official 25.12 + Flippy)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'feeds.conf.default'
      - '.github/workflows/*.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install Dependencies (Official OpenWrt Prerequisites)
        run: |
          sudo apt-get update
          # 包含官方源码所需的全量编译工具
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-dev rsync subversion swig time xsltproc zlib1g-dev help2man \
            bison flex cmake libfuse-dev zstd unzip antlr3 gperf

      - name: Clone OpenWrt Source (25.12 branch)
        run: |
          # 直接克隆 25.12 分支，不要 checkout 不存在的 tag
          git clone -b openwrt-25.12 --depth=1 https://github.com/openwrt/openwrt.git openwrt

      - name: Copy Config Files
        run: |
          cp ${{ github.workspace }}/.config openwrt/.config
          cp ${{ github.workspace }}/feeds.conf.default openwrt/feeds.conf.default

      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify Target and SSL Dependencies
        run: |
          cd openwrt
          # 核心修复：生成依赖检查的 stamp 文件，彻底绕过 OpenWrt 的宿主机环境检查
          mkdir -p staging_dir/host
          touch staging_dir/host/.prereq-build
          
          # 执行 make defconfig 生成最终配置
          make defconfig
          
          # 验证 Target 是否为 armvirt/64
          if ! grep -q "^CONFIG_TARGET_armvirt_64_Default=y" .config; then
            echo "❌ 致命错误：Target 配置未生效！"
            grep '^CONFIG_TARGET_' .config
            exit 1
          fi
          
          # 验证 uhttpd 和 SSL 库，防止网页打不开
          if ! grep -q "^CONFIG_PACKAGE_uhttpd=y" .config || ! grep -q "^CONFIG_PACKAGE_libustream-openssl=y" .config; then
            echo "❌ 致命错误：uhttpd 或 SSL 依赖丢失！"
            exit 1
          fi
          echo "✅ Target 与 SSL 依赖验证通过！"

      - name: Compile the Firmware
        run: |
          cd openwrt
          make download -j8
          # 如果并行编译失败，则用单线程编译并输出详细日志
          make -j$(nproc) || make -j1 V=s

      - name: Package OpenWrt Firmware
        uses: ophub/flippy-openwrt-actions@main
        env:
          # 输入编译生成的通用 rootfs
          OPENWRT_ARMVIRT: openwrt/bin/targets/armvirt/64/*.tar.gz
          # 指定 SOC 为 N1 的 s905d
          PACKAGE_SOC: s905d
          # 指定内核版本
          KERNEL_VERSION_NAME: 6.12.y
          KERNEL_AUTO_LATEST: true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: N1-OpenWrt-25.12-Firmware
          # 使用 Flippy 打包后的绝对路径
          path: /opt/openwrt_packit/output/*
          if-no-files-found: error
