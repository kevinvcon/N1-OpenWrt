name: Build OpenWrt for Phicomm N1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'   # 每周日 UTC 0 点自动编译，可删除

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set current date
        id: date
        run: echo "date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            rsync subversion swig time xsltproc zlib1g-dev unzip wget

      - name: Clone OpenWrt source
        run: |
          git clone https://github.com/openwrt/openwrt.git --depth 1 -b openwrt-25.12 openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure OpenWrt
        run: |
          cd openwrt
          make defconfig
          cat >> .config <<EOF
          CONFIG_TARGET_amlogic=y
          CONFIG_TARGET_amlogic_meson=y
          CONFIG_TARGET_amlogic_meson_DEVICE_phicomm_n1=y
          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          # 基础 LuCI 和常用工具
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filetransfer=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-ntfs=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-usb-acm=y
          CONFIG_PACKAGE_kmod-usb-serial=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_losetup=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_dosfstools=y
          CONFIG_PACKAGE_tar=y
          CONFIG_PACKAGE_gzip=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_vim=y
          CONFIG_PACKAGE_screen=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_openssh-server=y
          CONFIG_PACKAGE_dropbear=y
          EOF
          make defconfig

      - name: Download dependencies
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Compile OpenWrt
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Find rootfs.tar.gz
        id: find_rootfs
        run: |
          ROOTFS=$(find openwrt/bin/targets -name "*rootfs.tar.gz" | head -n 1)
          echo "rootfs=$ROOTFS" >> $GITHUB_OUTPUT
          echo "Found rootfs: $ROOTFS"

      - name: Package OpenWrt Firmware for N1
        uses: unifreq/openwrt_packit@master
        env:
          OPENWRT_ARMSR: ${{ steps.find_rootfs.outputs.rootfs }}
          PACKAGE_SOC: 's905d'
          KERNEL_VERSION_NAME: '6.12.y'
          KERNEL_AUTO_LATEST: 'true'
          OPENWRT_IP: '192.168.1.1'

      - name: Upload Firmware to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt_n1_${{ steps.date.outputs.date }}
          name: OpenWrt for Phicomm N1 ${{ steps.date.outputs.date }}
          body: |
            **Phicomm N1 OpenWrt Firmware**
            - 编译源码: OpenWrt 官方 (openwrt-25.12)
            - 打包工具: unifreq/openwrt_packit
            - 默认 IP: 192.168.1.1
            - 默认账号: root
            - 默认密码: password
          files: ${{ env.PACKAGED_OUTPUTPATH }}/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
