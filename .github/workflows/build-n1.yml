
name: Build N1 OpenWrt 25.12.5 Clean

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".config"
      - ".github/workflows/build-n1.yml"

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.5
  OPENWRT_DIR: openwrt
  LOG_DIR: ${{ github.workspace }}/openwrt-logs
  ARTIFACT_DIR: ${{ github.workspace }}/artifacts

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Prepare build environment
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Prepare Ubuntu build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "============================================================"
          echo "Preparing Ubuntu build environment"
          echo "============================================================"

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pip \
            python3-setuptools \
            rsync \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev \
            file \
            time \
            jq \
            ca-certificates \
            curl

          mkdir -p "${LOG_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

          echo
          echo "Ubuntu:"
          lsb_release -a || true

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

      # ============================================================
      # 2. Validate user .config before cloning OpenWrt
      # ============================================================
      - name: Validate .config
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Validating .config"
          echo "============================================================"

          if [ ! -f ".config" ]; then
            echo "ERROR: repository .config does not exist"
            exit 1
          fi

          sed -i 's/\r$//' .config

          if grep -nE '^(#|```|name:|on:|jobs:|CONFIG.*https?://)' .config; then
            echo
            echo "ERROR: .config appears to contain Markdown/YAML/invalid content"
            exit 1
          fi

          require_config() {
            local symbol="$1"

            if ! grep -Fqx -- "${symbol}" .config; then
              echo
              echo "ERROR: required config is missing:"
              echo "  ${symbol}"
              exit 1
            fi
          }

          echo
          echo "========== USER TARGET CONFIG =========="

          require_config "CONFIG_TARGET_armsr=y"
          require_config "CONFIG_TARGET_armsr_armv8=y"
          require_config "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y"

          echo "Target configuration:"
          grep '^CONFIG_TARGET_armsr' .config

          echo
          echo "========== FORBIDDEN TARGET CHECK =========="

          if grep -nE '^CONFIG_TARGET_(ath79|armvirt|mips)(=y|=m)' .config; then
            echo
            echo "ERROR: forbidden target detected"
            exit 1
          fi

          echo "No forbidden target detected."

          echo
          echo "========== FORBIDDEN PACKAGE CHECK =========="

          if grep -nE '^CONFIG_PACKAGE_(luci-app-passwall|luci-app-passwall2|docker|dockerd|docker-compose|dockerman|containerd)=y' .config; then
            echo
            echo "ERROR: forbidden package enabled"
            exit 1
          fi

          echo "No PassWall/Docker package enabled."

          echo
          echo "========== FULL USER .config =========="

          cat .config

      # ============================================================
      # 3. Clone OpenWrt
      # ============================================================
      - name: Clone OpenWrt 25.12.5
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Cloning OpenWrt"
          echo "============================================================"

          rm -rf "${OPENWRT_DIR}"

          git clone \
            --depth 1 \
            --branch "${OPENWRT_TAG}" \
            "${OPENWRT_REPO}" \
            "${OPENWRT_DIR}"

          cd "${OPENWRT_DIR}"

          echo
          echo "OpenWrt commit:"
          git log -1 --oneline

          echo
          echo "OpenWrt version:"
          git describe --tags --always || true

      # ============================================================
      # 4. Configure only official packages + luci feeds
      # ============================================================
      - name: Configure official feeds
        shell: bash
        run: |
          set -euo pipefail

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Configuring OpenWrt feeds"
          echo "============================================================"

          cat > feeds.conf.default <<'EOF'
          src-git packages https://git.openwrt.org/feed/packages.git;openwrt-25.12
          src-git luci https://git.openwrt.org/project/luci.git;openwrt-25.12
          EOF

          sed -i 's/^[[:space:]]*//' feeds.conf.default

          echo
          echo "========== feeds.conf.default =========="
          cat feeds.conf.default

          echo
          echo "========== Checking forbidden feeds =========="

          if grep -nE '(^|[[:space:]])src-git[[:space:]]+(routing|telephony|video)[[:space:]]' feeds.conf.default; then
            echo "ERROR: forbidden feed detected"
            exit 1
          fi

          echo "Feed configuration looks correct."

      # ============================================================
      # 5. Update packages feed
      # ============================================================
      - name: Update packages feed
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Updating packages feed"
          echo "============================================================"

          ./scripts/feeds update packages \
            2>&1 | tee "${LOG_DIR}/feeds-packages-update.log"

          status=${PIPESTATUS[0]}

          if [ "${status}" -ne 0 ]; then
            echo
            echo "============================================================"
            echo "PACKAGES FEED UPDATE FAILED"
            echo "============================================================"
            tail -n 500 "${LOG_DIR}/feeds-packages-update.log" || true
            exit "${status}"
          fi

      # ============================================================
      # 6. Update luci feed
      # ============================================================
      - name: Update luci feed
        shell: bash
        run: |
          set +e

          cd "${OPENWRT_DIR}"

          echo "============================================================"
          echo "Updating luci feed"
          echo "============================================================"

          ./scripts/feeds update luci \
            2>&1 | tee "${LOG_DIR}/feeds-luci-update.log"_

